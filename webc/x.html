<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X Feed</title>
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="black"/><text x="32" y="46" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" text-anchor="middle" fill="white">X</text></svg>'>
    <!-- warm up TLS to the proxy and image CDN before the first request -->
    <link rel="preconnect" href="https://api.allorigins.win" crossorigin>
    <link rel="preconnect" href="https://pbs.twimg.com" crossorigin>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #f0f0f0;
            color: #0f1419;
            line-height: 1.6;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 10px;
        }

        .control-panel {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-input {
            display: flex;
            align-items: center;
            border: 1px solid #ccc;
            border-radius: 20px;
            padding: 5px 10px;
            background-color: #fff;
        }

        .search-input input {
            border: none;
            outline: none;
            padding: 5px;
            font-size: 1em;
            border-radius: 20px;
            width: 160px;
        }

        .search-input button {
            background: none;
            border: none;
            cursor: pointer;
            margin-left: 5px;
            font-size: 1.2em;
            color: #0f1419;
        }

        .time-range {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .chip {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            background-color: #e0e0e0;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
            font-size: 0.9em;
        }

        .chip.active, .chip:hover {
            background-color: #0f1419;
            color: #fff;
        }

        .feed-label {
            text-align: center;
            font-size: 0.8em;
            color: #888;
            margin-bottom: 10px;
        }

        #postsContainer {
            margin-top: 10px;
        }

        .card {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .card-header {
            padding: 15px 20px;
        }

        .repost-label {
            font-size: 0.78em;
            color: #888;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .post-author {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            text-decoration: none;
            color: inherit;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #ddd;
            object-fit: cover;
            flex-shrink: 0;
        }

        .avatar-mono {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            font-size: 1.1em;
            text-transform: uppercase;
        }

        .author-info {
            flex: 1;
            min-width: 0;
        }

        .author-name {
            font-weight: 600;
            font-size: 0.95em;
            color: #0f1419;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .author-handle {
            font-size: 0.8em;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tweet-body {
            font-size: 0.95em;
            word-wrap: break-word;
        }

        .tweet-body p {
            margin-bottom: 8px;
        }

        .tweet-body p:last-child {
            margin-bottom: 0;
        }

        .tweet-body a {
            color: #1d9bf0;
            text-decoration: none;
            word-break: break-word;
        }

        .tweet-body a:hover {
            text-decoration: underline;
        }

        .tweet-body hr {
            display: none;
        }

        .tweet-body img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin-top: 10px;
            background-color: #f5f5f5;
            display: block;
        }

        .tweet-body blockquote {
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 10px 12px;
            margin-top: 10px;
            font-size: 0.92em;
            background-color: #fafafa;
        }

        .tweet-body blockquote b {
            display: block;
            font-size: 0.95em;
            margin-bottom: 4px;
            color: #0f1419;
        }

        .tweet-body blockquote p {
            margin-bottom: 4px;
        }

        .tweet-body blockquote footer,
        .tweet-body blockquote cite {
            display: none;
        }

        .card-stats {
            display: flex;
            gap: 16px;
            font-size: 0.85em;
            color: #555;
            padding-top: 10px;
            margin-top: 10px;
            border-top: 1px solid #f0f0f0;
            align-items: center;
        }

        .x-link {
            font-size: 0.85em;
            color: #1d9bf0;
            text-decoration: none;
        }

        .x-link:hover {
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            padding: 20px;
            font-size: 1.2em;
            color: #555;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0f1419;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 0.5s linear infinite;
            margin: 0 auto 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .time-range {
                gap: 5px;
            }
            .chip {
                padding: 6px 12px;
                font-size: 0.85em;
            }
            .search-input input {
                width: 130px;
            }
        }

        /* ---- dark mode (default) ---- */
        body { background-color: #000000; color: #e7e9ea; }
        .search-input { border-color: #2f3336; background-color: #16181c; }
        .search-input input { color: #e7e9ea; background: transparent; }
        .search-input input::placeholder { color: #71767b; }
        .search-input button { color: #e7e9ea; }
        .chip { background-color: #2a2d31; color: #e7e9ea; }
        .chip.active, .chip:hover { background-color: #1d9bf0; color: #fff; }
        .feed-label { color: #71767b; }
        .card { background-color: #16181c; box-shadow: 0 1px 0 #2f3336; }
        .author-name { color: #e7e9ea; }
        .avatar { background-color: #2a2d31; }
        .tweet-body img { background-color: #2a2d31; }
        .tweet-body blockquote { border-color: #2f3336; background-color: #1c1f23; }
        .tweet-body blockquote b { color: #e7e9ea; }
        .card-stats { color: #8b98a5; border-top-color: #2f3336; }
        .loading { color: #8b98a5; }
        .spinner { border-color: #2f3336; border-top-color: #1d9bf0; }

        /* ---- skeleton placeholders (shown only on a cold first load) ---- */
        .skeleton { pointer-events: none; }
        .skeleton .card-header { padding: 15px 20px; }
        .sk-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .sk-avatar { width: 40px; height: 40px; border-radius: 50%; background: #2a2d31; flex-shrink: 0; }
        .sk-lines { flex: 1; }
        .sk-line { height: 10px; border-radius: 5px; background: #2a2d31; margin-bottom: 9px; }
        .sk-line.short { width: 45%; }
        .sk-line:last-child { margin-bottom: 0; }
        .skeleton .sk-avatar, .skeleton .sk-line { animation: pulse 1.2s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* compact "refreshing" indicator (cache shown, fresh data loading) */
        .refreshing { display: inline-flex; align-items: center; gap: 8px; font-size: 0.85em; }
        .refreshing .spinner { width: 16px; height: 16px; border-width: 3px; margin: 0; }

        /* page-level loading bar — a deterministic progress fill at the top of the
           page that advances as feeds complete (completed / total accounts) */
        #topbar {
            position: fixed; top: 0; left: 0; right: 0; height: 3px;
            z-index: 1000; overflow: hidden; pointer-events: none;
            opacity: 0; transition: opacity 0.25s;
        }
        #topbar.active { opacity: 1; }
        #topbar-fill {
            height: 100%; width: 0;
            background: #1d9bf0; border-radius: 0 3px 3px 0;
            box-shadow: 0 0 8px rgba(29, 155, 240, 0.6);
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="topbar"><div id="topbar-fill"></div></div>
    <div class="container">
        <div class="control-panel">
            <div class="search-input">
                <input type="text" id="searchInput" placeholder="@handle" />
                <button id="searchBtn" title="View handle">→</button>
            </div>
            <div class="time-range">
                <button class="chip" data-time="day">Day</button>
                <button class="chip active" data-time="week">Week</button>
                <button class="chip" data-time="month">Month</button>
                <button class="chip" data-time="all">All</button>
            </div>
        </div>
        <div class="feed-label" id="feedLabel"></div>
        <div id="postsContainer"></div>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            Loading posts...
        </div>
    </div>

    <script>
        // X (Twitter) has no public CORS-enabled API, so we read public RSS from
        // an xcancel (Nitter) instance through the allorigins CORS proxy. Nitter
        // RSS carries the tweet text, media, quote-tweets and timestamps — but no
        // like/retweet counts or replies, so this is a clean read-only feed.
        // Nitter instances are individually flaky/often-down, so we fail over
        // between them: race them on a cold start, then stick to whichever responds.
        const INSTANCES = [
            'https://xcancel.com',
            'https://nitter.net',
            'https://nitter.tiekoetter.com',
            'https://nitter.space',
            'https://lightbrd.com',
            'https://nitter.privacyredirect.com',
            'https://nitter.poast.org',
            'https://nuku.trabun.org',
            'https://bird.trom.tf'
        ];
        const INSTANCE_HOSTS = INSTANCES.map(u => u.replace(/^https?:\/\//, ''));
        let WORKING_INSTANCE = null;   // sticky once one proves healthy

        // Curated tech / AI accounts on X (handles without @).
        const AI_ACCOUNTS = [
            'sama',
            'OpenAI',
            'AndrewYNg',
            'ylecun',
            'karpathy',
            'GoogleDeepMind',
            'AnthropicAI',
            'demishassabis',
            'JeffDean',
            'fchollet',
            'goodfellow_ian',
            'sundarpichai',
            'paulg',
            'emollick',
            'OpenAIDevs',
            // Independent AI reporters / researchers / journalists
            'CaseyNewton',     // Platformer
            'Kantrowitz',      // Big Technology
            'binarybits',      // Understanding AI
            'natolambert',     // Interconnects
            'jackclarkSF',     // Import AI
            'rowancheung',     // The Rundown AI
            'bentossell',      // Ben's Bites
            '_KarenHao',       // Karen Hao
            'EricNewcomer',    // Eric Newcomer
            'jasminewsun',     // Jasmine Sun
            'sharongoldman',   // Sharon Goldman — independent AI journalist (Substack)
            'GarrisonLovely',  // Garrison Lovely — freelance, political economy of AI
            'levie',           // Aaron Levie (Box)
            // Execs / researchers / practitioners
            'gdb',             // Greg Brockman — OpenAI president/co-founder
            'drfeifei',        // Fei-Fei Li — Stanford, ImageNet
            'alliekmiller',    // Allie K. Miller — AI business strategist
            'OfficialLoganK',  // Logan Kilpatrick — developer tools/ecosystem
            'mattshumer_',     // Matt Shumer — AI builder, agent workflows
            'svpino',          // Santiago Valdarrama — AI automation/agents
            'GoogleAI',        // Google AI — official announcements
            // Builders, educators & practitioners
            'rasbt',           // Sebastian Raschka — LLMs, implementation
            'maximelabonne',   // Maxime Labonne — fine-tuning, quantization
            'chipro',          // Chip Huyen — AI engineering, MLOps
            'goodside',        // Riley Goodside — prompt engineering
            'levelsio',        // Pieter Levels — indie AI products
            'DrJimFan',        // Jim Fan — NVIDIA, embodied AI/robotics
            'steipete',        // Peter Steinberger — practical AI dev tools
            'theaibuilders',   // community account for AI builders
            'kimmonismus',     // Chubby — AI news / hype tracker
            // AI leakers & product trackers
            'synthwavedd',     // leo — AI leaks (Astra/mewfour)
            'btibor91',        // Tibor Blaho — reverse-engineered AI discoveries
            'testingcatalog',  // TestingCatalog — product-leak updates
            'slow_developer'   // Haider — AI news (404 on Nitter as of adding;
                               // harmless in merged batches, works when it recovers)
        ];

        // Staggered fetch policy: the feed runs through free public proxies
        // (rss2json, allorigins) that rate-limit under bursts, so we (a) cap how
        // many requests are in flight at once and (b) space out each launch. On top
        // of that, accounts are fetched in BATCHES via Nitter's multi-user merged
        // RSS (/user1,user2,.../rss) — 44 accounts collapse into ~9 requests
        // instead of 44, the single biggest speed lever available through a proxy.
        const MAX_INFLIGHT = 3;      // never more than this many requests at once
        const STAGGER_MS = 400;      // minimum gap between launching requests
        const BATCH_SIZE = 5;        // handles per merged-RSS request (each merged
                                     // feed returns ~20 newest items across the batch)
        const FEED_FRESH_MS = 10 * 60 * 1000;   // skip the network entirely if the
                                     // last full refresh was this recent (Nitter's
                                     // own RSS cache TTL is 40 min anyway)
        const RUN_DEADLINE_MS = 75 * 1000;      // hard cap per refresh run — finish
                                     // with what we have instead of dragging on

        let TIMEFRAME = 'week';
        let CUSTOM_HANDLE = '';
        let currentReq = 0;   // guards against stale renders / supersedes in-flight runs
        const MAX_CARDS = 80;
        const CACHE_MAX = 120;          // posts kept per feed in localStorage
        const CACHE_PREFIX = 'xfeed_v1:';

        // Stale-while-revalidate: render the last good feed instantly, refresh behind it.
        function cacheKeyFor() {
            return CACHE_PREFIX + (CUSTOM_HANDLE ? 'h:' + CUSTOM_HANDLE.toLowerCase() : 'curated');
        }
        function loadCache(key) {
            try {
                const o = JSON.parse(localStorage.getItem(key) || 'null');
                return o && Array.isArray(o.posts) ? o : null;
            } catch (e) { return null; }
        }
        function saveCache(key, posts) {
            // Returns success so callers can refuse to stamp freshness on a cache
            // that silently failed to write (quota / private mode).
            try { localStorage.setItem(key, JSON.stringify({ ts: Date.now(), posts })); return true; }
            catch (e) { return false; }
        }

        // Freshness gate: after a successful full refresh we stamp the feed as
        // fresh; loads within FEED_FRESH_MS render the cache and skip the network.
        function markFresh(key) {
            try { localStorage.setItem(key + ':fresh', String(Date.now())); } catch (e) { }
        }
        function isFresh(key) {
            try {
                const age = Date.now() - (+localStorage.getItem(key + ':fresh') || 0);
                return age >= 0 && age < FEED_FRESH_MS;   // negative age = clock jumped — distrust
            }
            catch (e) { return false; }
        }

        // Housekeeping: per-searched-handle caches (+ fresh stamps) accumulate one
        // localStorage pair per handle ever searched — drop any not touched in 7 days.
        (function pruneOldHandleCaches() {
            try {
                const cutoff = Date.now() - 7 * 24 * 3600 * 1000;
                Object.keys(localStorage)
                    .filter(k => k.startsWith(CACHE_PREFIX + 'h:') && !k.endsWith(':fresh'))
                    .forEach(k => {
                        let ts = 0;
                        try { ts = (JSON.parse(localStorage.getItem(k) || '{}').ts) || 0; } catch (e) { }
                        if (ts < cutoff || ts > Date.now() + 60000) {
                            localStorage.removeItem(k);
                            localStorage.removeItem(k + ':fresh');
                        }
                    });
            } catch (e) { }
        })();

        // Identity store: merged multi-user RSS has per-item @handles but no
        // display names or avatars, so we remember author → {name, avatar} from
        // every source that does carry them (single-handle feeds' channel header,
        // and previously cached posts) and resolve at render time.
        const IDENT_KEY = CACHE_PREFIX + 'identities';
        let IDENTITIES = {};
        try { IDENTITIES = JSON.parse(localStorage.getItem(IDENT_KEY) || '{}') || {}; } catch (e) { }
        let identDirty = false, lastIdentSave = 0;
        function harvestIdentity(author, name, avatar) {
            if (!author || !avatar) return;
            const k = author.toLowerCase();
            const cur = IDENTITIES[k];
            const bestName = (name && name !== author) ? name : (cur && cur.n) || name || author;
            if (cur && cur.a === avatar && cur.n === bestName) return;
            IDENTITIES[k] = { n: bestName, a: avatar, t: Date.now() };
            identDirty = true;
            if (Date.now() - lastIdentSave > 3000) saveIdentities();
        }
        function saveIdentities() {
            if (!identDirty) return;
            lastIdentSave = Date.now(); identDirty = false;
            try {
                const keys = Object.keys(IDENTITIES);
                if (keys.length > 400) {
                    // Bound storage — but never evict curated feed owners (their
                    // identities are the whole point of the store); prune the
                    // oldest incidental authors (RT'd accounts etc.) first.
                    const owners = new Set(AI_ACCOUNTS.map(h => h.toLowerCase()));
                    keys.filter(k => !owners.has(k))
                        .sort((a, b) => (IDENTITIES[a].t || 0) - (IDENTITIES[b].t || 0))
                        .slice(0, Math.max(0, keys.length - 400))
                        .forEach(k => delete IDENTITIES[k]);
                }
                localStorage.setItem(IDENT_KEY, JSON.stringify(IDENTITIES));
            } catch (e) { }
        }

        // Sticky instance persists across page loads, so repeat visits skip the
        // (slow) instance-discovery race entirely. TTL keeps a dead instance from
        // being trusted forever; a failed fetch also clears it immediately.
        const INST_KEY = CACHE_PREFIX + 'instance';
        const INSTANCE_TTL_MS = 30 * 60 * 1000;
        (function restoreInstance() {
            try {
                const o = JSON.parse(localStorage.getItem(INST_KEY) || 'null');
                const age = o ? Date.now() - o.ts : -1;
                if (o && o.url && INSTANCES.includes(o.url) && age >= 0 && age < INSTANCE_TTL_MS) {
                    WORKING_INSTANCE = o.url;
                }
            } catch (e) { }
        })();
        function setWorkingInstance(inst) {
            WORKING_INSTANCE = inst;
            try {
                if (inst) localStorage.setItem(INST_KEY, JSON.stringify({ url: inst, ts: Date.now() }));
                else localStorage.removeItem(INST_KEY);
            } catch (e) { }
        }

        const TIME_RANGES = {
            day: 24 * 60 * 60,
            week: 7 * 24 * 60 * 60,
            month: 30 * 24 * 60 * 60,
            all: null
        };

        const MONO_COLORS = ['#1d9bf0', '#0f1419', '#794bc4', '#f91880', '#00ba7c', '#ff7a00', '#536471'];

        document.addEventListener('DOMContentLoaded', () => {
            fetchPosts();

            document.querySelectorAll('.chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    if (chip.classList.contains('active')) return;
                    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    TIMEFRAME = chip.dataset.time;
                    fetchPosts(true);   // reload → show the shimmer again
                });
            });

            document.getElementById('searchBtn').addEventListener('click', () => {
                CUSTOM_HANDLE = document.getElementById('searchInput').value.trim().replace(/^@/, '');
                // An explicit search is a deliberate refresh request — bust the
                // freshness stamp so it always refetches (filter chips stay gated).
                try { localStorage.removeItem(cacheKeyFor() + ':fresh'); } catch (e) { }
                fetchPosts(true);
            });

            document.getElementById('searchInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') document.getElementById('searchBtn').click();
            });
        });

        // ---- fetching ----------------------------------------------------------

        function b64ToUtf8(b64) {
            const bin = atob(b64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return new TextDecoder('utf-8').decode(bytes);
        }

        // Fetch with a hard timeout (so a hung request can't stall the feed) plus an
        // optional external signal (so a race can cancel the losing instances).
        async function fetchText(url, timeoutMs, extSignal) {
            const ctrl = new AbortController();
            const to = setTimeout(() => ctrl.abort(), timeoutMs);
            const onAbort = () => ctrl.abort();
            if (extSignal) {
                if (extSignal.aborted) ctrl.abort();
                else extSignal.addEventListener('abort', onAbort);
            }
            try {
                const res = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
                return res.ok ? await res.text() : null;
            } finally {
                clearTimeout(to);
                if (extSignal) extSignal.removeEventListener('abort', onAbort);
            }
        }

        function decodeAllorigins(raw) {
            let c;
            try { c = JSON.parse(raw).contents; } catch { return null; }
            if (!c) return null;
            if (c.startsWith('data:')) {
                const idx = c.indexOf('base64,');
                c = idx !== -1 ? b64ToUtf8(c.slice(idx + 7)) : decodeURIComponent(c.slice(c.indexOf(',') + 1));
            }
            return (c.includes('<rss') || c.includes('<item>')) ? c : null;
        }

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        // ---- transports --------------------------------------------------------
        // Two independent ways to read a Nitter RSS URL from the browser; each
        // returns normalized post objects or null on failure. Keeping both means
        // one proxy having a bad day (allorigins 520s, rss2json 500s) doesn't
        // take the feed down.
        //   1. rss2json — purpose-built RSS→JSON API, CORS-native, ~1-2s, caches
        //      server-side. Keyless tier caps at 10 items per feed.
        //   2. allorigins — generic CORS mirror returning the raw XML (~5-15s,
        //      flakier, but no item cap and a different egress network).
        // The transport that last worked is sticky (persisted), same as instances.

        const TRANSPORTS = [
            {
                name: 'rss2json',
                async get(target, handles, extSignal, timeoutMs) {
                    const url = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(target);
                    const raw = await fetchText(url, timeoutMs || 12000, extSignal);
                    if (!raw) return null;
                    let d;
                    try { d = JSON.parse(raw); } catch (e) { return null; }
                    if (!d || d.status !== 'ok' || !Array.isArray(d.items)) return null;
                    // Some instances serve RSS readers a "not whitelisted" stub —
                    // that's a failure for our purposes, not a feed.
                    if (/not yet whitelisted/i.test((d.feed && d.feed.title) || '')) return null;
                    return parseR2J(d, handles);
                }
            },
            {
                name: 'allorigins',
                async get(target, handles, extSignal, timeoutMs) {
                    const url = 'https://api.allorigins.win/get?url=' + encodeURIComponent(target);
                    const raw = await fetchText(url, timeoutMs || 12000, extSignal);
                    if (!raw) return null;
                    const xml = decodeAllorigins(raw);
                    if (!xml) return null;
                    return parseFeed(xml, handles);   // throws on parsererror → caught below
                }
            }
        ];

        const TRANSPORT_KEY = CACHE_PREFIX + 'transport';
        let TRANSPORT_IDX = 0;
        try {
            const savedT = +localStorage.getItem(TRANSPORT_KEY);
            if (savedT >= 0 && savedT < TRANSPORTS.length) TRANSPORT_IDX = savedT;
        } catch (e) { }
        function setTransport(i) {
            TRANSPORT_IDX = i;
            try { localStorage.setItem(TRANSPORT_KEY, String(i)); } catch (e) { }
        }

        // Fetch one instance+path, trying the sticky transport first and failing
        // over to the other per attempt. Returns posts[] or null.
        async function fetchInstance(instance, path, handles, attempts, extSignal) {
            const target = `${instance}${path}`;
            for (let i = 0; i < attempts; i++) {
                if (extSignal && extSignal.aborted) return null;
                for (let k = 0; k < TRANSPORTS.length; k++) {
                    if (extSignal && extSignal.aborted) return null;
                    const idx = (TRANSPORT_IDX + k) % TRANSPORTS.length;
                    try {
                        // Give the sticky transport the full window; probe the
                        // fallback with a shorter one so a dead proxy can't drag
                        // every attempt out by 12s.
                        const posts = await TRANSPORTS[idx].get(target, handles, extSignal, k === 0 ? 12000 : 6000);
                        if (posts !== null) {
                            if (idx !== TRANSPORT_IDX) setTransport(idx);
                            return posts;
                        }
                    } catch (e) { /* parse/network failure — try next transport */ }
                }
                // Backoff before retrying: both proxies return transient errors
                // that clear a beat later. Skip the wait after the final attempt.
                if (i < attempts - 1 && !(extSignal && extSignal.aborted)) {
                    await sleep(700 * (i + 1));
                }
            }
            return null;
        }

        // Find a working instance. allorigins buckles if hit with many concurrent
        // requests, so we probe instances 3 at a time (not all at once): the first
        // of a group to return valid RSS wins, becomes sticky, and aborts the rest.
        async function establishInstance(path, handles, extSignal) {
            for (let i = 0; i < INSTANCES.length; i += 3) {
                if (extSignal && extSignal.aborted) return null;
                const group = INSTANCES.slice(i, i + 3);
                const ctrl = new AbortController();
                const onAbort = () => ctrl.abort();
                if (extSignal) extSignal.addEventListener('abort', onAbort);
                const posts = await new Promise(resolve => {
                    let pending = group.length;
                    let settled = false;
                    group.forEach(inst => {
                        fetchInstance(inst, path, handles, 2, ctrl.signal).then(x => {
                            if (settled) return;
                            if (x) { settled = true; setWorkingInstance(inst); ctrl.abort(); resolve(x); }
                            else if (--pending === 0) resolve(null);
                        });
                    });
                });
                if (extSignal) extSignal.removeEventListener('abort', onAbort);
                if (posts) return posts;
            }
            return null;
        }

        // Use the known-good instance if we have one; otherwise probe to find one.
        // Discovery is SERIALIZED: only one instance race runs at a time — any
        // other request that arrives instance-less waits for that race instead of
        // launching its own (a parallel stampede of races is how a struggling
        // proxy gets rate-limited into the ground).
        let establishing = null;
        let stickyFails = 0;   // consecutive distinct-path failures on the sticky instance
        async function fetchViaProxy(path, handles, extSignal) {
            if (WORKING_INSTANCE) {
                const inst = WORKING_INSTANCE;
                const posts = await fetchInstance(inst, path, handles, 3, extSignal);
                if (posts) {
                    stickyFails = 0;
                    setWorkingInstance(inst);   // re-stamp the persisted TTL on success
                    return posts;
                }
                if (extSignal && extSignal.aborted) return null;
                // A concurrent request may have already replaced the instance while
                // we were failing — use theirs instead of clobbering it.
                if (WORKING_INSTANCE && WORKING_INSTANCE !== inst) {
                    return fetchInstance(WORKING_INSTANCE, path, handles, 3, extSignal);
                }
                // One failing path might be the PATH's fault (dead handle in the
                // batch) or transient proxy flake, not the instance's — only
                // declare the instance dead after three different requests fail.
                stickyFails++;
                if (stickyFails < 3) return null;
                stickyFails = 0;
                if (WORKING_INSTANCE === inst) setWorkingInstance(null);
            }
            if (extSignal && extSignal.aborted) return null;
            if (!establishing) {
                // This request leads the discovery race; its own path rides along.
                establishing = establishInstance(path, handles, extSignal).finally(() => { establishing = null; });
                return establishing;
            }
            // Someone else is already discovering — wait, then use their result.
            await establishing.catch(() => null);
            if (extSignal && extSignal.aborted) return null;
            if (WORKING_INSTANCE) return fetchInstance(WORKING_INSTANCE, path, handles, 3, extSignal);
            // The leader's race failed — possibly because of ITS path, not the
            // network. Lead one race of our own (still serialized) before giving up.
            if (!establishing) {
                establishing = establishInstance(path, handles, extSignal).finally(() => { establishing = null; });
                return establishing;
            }
            await establishing.catch(() => null);
            return WORKING_INSTANCE ? fetchInstance(WORKING_INSTANCE, path, handles, 3, extSignal) : null;
        }

        // Fetch one unit — a single handle or an array of handles. Multiple handles
        // use Nitter's multi-user merged RSS (/user1,user2/rss): one request covers
        // the whole batch, with per-item dc:creator attribution. Parsing happens
        // inside the transports (rss2json returns items, allorigins returns XML).
        // Returns null on failure (vs [] for a feed that parsed but had nothing).
        async function fetchFeed(handleOrList, extSignal) {
            const handles = Array.isArray(handleOrList) ? handleOrList : [handleOrList];
            const path = '/' + handles.map(encodeURIComponent).join(',') + '/rss';
            return fetchViaProxy(path, handles, extSignal);
        }

        function parseFeed(xmlText, handles) {
            const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
            // Throw (not []) so fetchFeed reports null = failure: a truncated or
            // garbage response must not count as a "successful" unit, or a failed
            // run could get stamped fresh and lock in stale cache for 10 minutes.
            if (doc.querySelector('parsererror')) throw new Error('unparseable RSS');

            // Single-handle feeds carry the owner's display name + avatar in the
            // channel header; merged feeds don't (title is "a | b | c"), so there
            // we rely on the identity store, populated from single fetches + cache.
            const single = handles.length === 1 ? handles[0] : null;
            const channelTitle = (doc.querySelector('channel > title')?.textContent || '').trim();
            const ownerName = single ? (channelTitle.split(' / ')[0] || single) : '';
            const ownerAvatar = single ? (doc.querySelector('channel > image > url')?.textContent || '') : '';
            if (single && ownerAvatar) harvestIdentity(single, ownerName, ownerAvatar);

            const posts = [];
            doc.querySelectorAll('item').forEach(item => {
                const title = item.querySelector('title')?.textContent || '';
                const creatorRaw = (item.getElementsByTagNameNS('*', 'creator')[0]?.textContent || `@${handles[0]}`).trim();
                const creator = creatorRaw.replace(/^@/, '');
                const desc = item.querySelector('description')?.textContent || '';
                const pubDate = item.querySelector('pubDate')?.textContent || '';
                const link = item.querySelector('link')?.textContent || '';

                const rt = title.match(/^RT by @([\w]+):/);
                const isRT = !!rt;
                const isOwner = !!single && !isRT && creator.toLowerCase() === single.toLowerCase();

                posts.push({
                    feedHandle: handles.join(','),
                    author: creator,
                    authorName: isOwner ? ownerName : creator,
                    avatar: isOwner ? ownerAvatar : '',
                    repostedBy: isRT ? rt[1] : null,
                    descHtml: desc,
                    date: pubDate ? new Date(pubDate).getTime() : 0,
                    link: rewriteUrl(link)
                });
            });
            return posts;
        }

        // Nitter serves channel avatars through its own image proxy
        // (https://<instance>/pic/<url-encoded pbs.twimg.com URL>). Unwrap to the
        // direct CDN URL so stored avatars survive that instance going down.
        function unwrapNitterPic(url) {
            const m = String(url || '').match(/^https?:\/\/[^/]+\/pic\/(.+)$/);
            if (!m) return url || '';
            try {
                const inner = decodeURIComponent(m[1]);
                return /^https?:\/\//.test(inner) ? inner : url;
            } catch (e) { return url; }
        }

        // Normalize an rss2json response to the same post shape parseFeed emits.
        // rss2json maps dc:creator → item.author and rewrites pubDate to a
        // "YYYY-MM-DD HH:mm:ss" string in UTC (parse it as UTC, not local time).
        function parseR2J(d, handles) {
            const single = handles.length === 1 ? handles[0] : null;
            const feed = d.feed || {};
            const ownerName = single ? ((feed.title || '').split(' / ')[0] || single) : '';
            const ownerAvatar = single ? unwrapNitterPic(feed.image || '') : '';
            if (single && ownerAvatar) harvestIdentity(single, ownerName, ownerAvatar);

            return (d.items || []).map(item => {
                const title = item.title || '';
                const creator = String(item.author || handles[0]).replace(/^@/, '').trim() || handles[0];
                const rt = title.match(/^RT by @([\w]+):/);
                const isRT = !!rt;
                const isOwner = !!single && !isRT && creator.toLowerCase() === single.toLowerCase();
                let ts = 0;
                if (item.pubDate) {
                    // "2026-07-29 17:46:06" (UTC) → ISO; fall back to native parsing
                    ts = Date.parse(item.pubDate.replace(' ', 'T') + 'Z');
                    if (isNaN(ts)) ts = Date.parse(item.pubDate) || 0;
                }
                return {
                    feedHandle: handles.join(','),
                    author: creator,
                    authorName: isOwner ? ownerName : creator,
                    avatar: isOwner ? ownerAvatar : '',
                    repostedBy: isRT ? rt[1] : null,
                    descHtml: item.description || item.content || '',
                    date: ts,
                    link: rewriteUrl(item.link || '')
                };
            });
        }

        // --- deterministic top progress bar (advances as feeds complete) ---
        let barHideTimer = null;   // pending fade-out; cancelled if a new run starts
        function startProgress() {
            if (barHideTimer) { clearTimeout(barHideTimer); barHideTimer = null; }
            const bar = document.getElementById('topbar');
            const fill = document.getElementById('topbar-fill');
            fill.style.transition = 'none';
            fill.style.width = '8%';     // small head start so there's always a visible bar
            void fill.offsetWidth;       // reflow so the reset itself isn't animated
            fill.style.transition = 'width 0.3s ease';
            bar.classList.add('active');
        }
        function setProgress(completed, total) {
            const fill = document.getElementById('topbar-fill');
            const frac = total ? Math.min(completed / total, 1) : 0;
            fill.style.width = (8 + 90 * frac).toFixed(1) + '%';   // 8% → 98%
        }
        function finishProgress() {
            const bar = document.getElementById('topbar');
            document.getElementById('topbar-fill').style.width = '100%';
            if (barHideTimer) clearTimeout(barHideTimer);
            barHideTimer = setTimeout(() => { bar.classList.remove('active'); barHideTimer = null; }, 250);
        }

        let runCtrl = null;   // abort controller for the current run's network work

        async function fetchPosts(reload = false) {
            // Bump the request id first: any in-flight run sees myReq !== currentReq
            // at its next checkpoint and bails, so a filter/search switch supersedes
            // a slow load instead of being dropped. Abort the old run's network work
            // too — otherwise its retry chains keep burning the proxy's rate limit
            // underneath the new run.
            const myReq = ++currentReq;
            if (runCtrl) runCtrl.abort();
            runCtrl = new AbortController();
            const signal = runCtrl.signal;

            const loading = document.getElementById('loading');
            const container = document.getElementById('postsContainer');
            const label = document.getElementById('feedLabel');
            startProgress();   // page-level deterministic progress bar
            container.innerHTML = '';

            const accounts = CUSTOM_HANDLE ? [CUSTOM_HANDLE] : AI_ACCOUNTS;
            // Chunk accounts into merged-RSS batch units — the core speed lever:
            // 44 accounts → ~9 requests instead of 44.
            const units = [];
            for (let i = 0; i < accounts.length; i += BATCH_SIZE) {
                units.push(accounts.slice(i, i + BATCH_SIZE));
            }
            const totalFeeds = units.length;   // units to fetch → drives the progress bar
            let completed = 0;
            let successUnits = 0;              // units that returned a parseable feed
            let didNetwork = false;            // did this run actually hit the network?
            let runDone = false;               // completion latch (normal or deadline)
            let deadlineTimer = null;
            label.textContent = CUSTOM_HANDLE
                ? `@${CUSTOM_HANDLE}`
                : `Curated tech & AI feed · ${AI_ACCOUNTS.length} accounts · via xcancel`;

            const seen = new Set();
            const allPosts = [];   // every deduped post (cache + live), for re-caching
            const range = TIME_RANGES[TIMEFRAME];
            const cutoff = range ? Date.now() - range * 1000 : null;
            let total = 0;
            let skeletonsShown = false;
            let lastPersist = 0;

            // Persist progressively (throttled) so an abandoned multi-minute load
            // still leaves a usable cache for next time.
            let persistOk = false;   // did the latest cache write actually land?
            function persist(force) {
                if (!allPosts.length) return;
                const now = Date.now();
                if (!force && now - lastPersist < 2500) return;
                lastPersist = now;
                persistOk = saveCache(key, allPosts.slice().sort((a, b) => b.date - a.date).slice(0, CACHE_MAX));
            }

            function clearSkeletons() {
                if (!skeletonsShown) return;
                container.querySelectorAll('.skeleton').forEach(n => n.remove());
                skeletonsShown = false;
            }

            function showSkeletons() {
                for (let i = 0; i < 6; i++) {
                    const sk = document.createElement('div');
                    sk.className = 'card skeleton';
                    sk.innerHTML = '<div class="card-header"><div class="sk-row"><div class="sk-avatar"></div>'
                        + '<div class="sk-lines"><div class="sk-line"></div><div class="sk-line short"></div></div></div>'
                        + '<div class="sk-line"></div><div class="sk-line"></div><div class="sk-line short"></div></div>';
                    container.appendChild(sk);
                }
                skeletonsShown = true;
            }

            // Add a post to the dataset (for caching) and render it if it's within
            // the current time window and we haven't already shown it. Cards are only
            // ever appended to the end (never inserted mid-list) so the feed never
            // shifts under the reader; once the list is full we keep caching but stop
            // rendering. Cached posts are pre-sorted, so the visible order is newest
            // first, with any genuinely new tweets appended below.
            function addPost(p) {
                if (!p.link || seen.has(p.link)) return;
                seen.add(p.link);
                allPosts.push(p);
                // Remember display name + avatar for authors that carry them, so
                // batch-fetched posts (which don't) can be resolved at render time.
                if (p.avatar) harvestIdentity(p.author, p.authorName, p.avatar);
                if (cutoff && p.date <= cutoff) return;
                // After the run has visually completed (deadline or finish), keep
                // caching stragglers but stop appending cards under the reader.
                if (runDone || total >= MAX_CARDS) return;
                clearSkeletons();
                container.appendChild(buildCard(p));
                total++;
            }

            function handleFeed(posts) {
                if (myReq !== currentReq) return;
                if (posts && posts.length) posts.forEach(addPost);
                persist(false);
                // Once anything is on screen, downgrade the spinner to a quiet pill.
                if (total > 0 && loading.style.display !== 'none' && !loading.querySelector('.refreshing')) {
                    loading.innerHTML = '<span class="refreshing"><span class="spinner"></span>Refreshing…</span>';
                }
            }

            // Single completion path — reached normally when all units finish, or
            // early via the run deadline. Idempotent.
            function finishRun() {
                if (runDone || myReq !== currentReq) return;
                runDone = true;
                if (deadlineTimer) clearTimeout(deadlineTimer);
                clearSkeletons();
                loading.style.display = 'none';
                loading.innerHTML = '<div class="spinner"></div>Loading posts...';
                finishProgress();
                persist(true);
                saveIdentities();
                // Stamp freshness only for a run that actually fetched, mostly
                // succeeded, AND whose cache write landed — never for cache-only
                // paints (that would let frequent visits extend the stamp forever)
                // and never over a cache that failed to persist (quota).
                if (didNetwork && persistOk && successUnits >= Math.ceil(units.length / 2)) {
                    markFresh(key);
                }
                if (total === 0) {
                    container.innerHTML = '<p style="text-align:center;color:#888;padding:30px;">No posts in this time range.<br><span style="font-size:0.85em;">(xcancel or the proxy may be rate-limited — try again or pick a wider range.)</span></p>';
                }
            }

            // 1) Paint the last cached feed instantly so the user never stares at a
            //    bare spinner for a flaky multi-minute fetch. Show shimmer skeletons
            //    on a cold load (no cache) and on every user-triggered reload
            //    (filter/search switch) so the switch gets visible feedback.
            const key = cacheKeyFor();
            const cached = loadCache(key);
            const haveCache = !!(cached && cached.posts.length);

            if (reload || !haveCache) {
                showSkeletons();
                loading.style.display = 'block';
                loading.innerHTML = '<div class="spinner"></div>Loading posts...';
            }
            // On a reload that has cache to fall back on, hold the shimmer briefly so
            // it's actually seen before the (instant) cached results replace it.
            if (reload && haveCache) {
                await new Promise(r => setTimeout(r, 450));
                if (myReq !== currentReq) return;
            }
            if (haveCache) {
                cached.posts.slice().sort((a, b) => b.date - a.date).forEach(addPost);
            }
            if (total > 0) {
                loading.style.display = 'block';
                loading.innerHTML = '<span class="refreshing"><span class="spinner"></span>Refreshing…</span>';
            }

            // Freshness gate: if a full refresh completed very recently, the cache
            // IS current (upstream Nitter caches RSS for ~40 min anyway) — render
            // it and skip the network entirely. Quick revisits and filter switches
            // become instant and cost zero requests. Only gate when the filtered
            // view actually has content: an empty view falls through to a real
            // fetch, so its "no posts / try again" state is never a 10-minute
            // dead end.
            if (haveCache && isFresh(key) && total > 0) {
                setProgress(1, 1);
                finishRun();
                return;
            }

            // Hard cap on the whole run: when it fires, finish with what we have
            // and abort the in-flight retry chains (they'd otherwise keep burning
            // the proxy's rate limit for minutes after the UI completed).
            deadlineTimer = setTimeout(() => {
                if (myReq === currentReq && !runDone) {
                    finishRun();
                    runCtrl.abort();
                }
            }, RUN_DEADLINE_MS);
            didNetwork = true;

            // Cold start: establish a healthy instance on the first unit alone
            // (racing instances) so the parallel pool below can reuse it instead of
            // all stampeding the instance list at once. With a persisted sticky
            // instance this phase is skipped entirely on repeat visits. If it
            // fails, unit 0 stays in the launcher queue and gets retried there —
            // its 5 accounts must not silently vanish from the run.
            let startIdx = 0;
            if (!WORKING_INSTANCE && units.length) {
                let firstPosts = null;
                try { firstPosts = await fetchFeed(units[0], signal); } catch (e) { /* ignore */ }
                if (myReq !== currentReq) return;
                if (firstPosts !== null) {
                    successUnits++;
                    handleFeed(firstPosts);
                    completed++; setProgress(completed, totalFeeds);
                    startIdx = 1;
                }
            }

            // Staggered launcher: keep at most MAX_INFLIGHT batch requests in
            // flight and leave at least STAGGER_MS between launches, so we never
            // burst the proxy. Each batch still renders the moment it arrives.
            await new Promise(resolve => {
                let next = startIdx, active = 0, finished = startIdx, launching = false;
                function launch() {
                    if (myReq !== currentReq || runDone) { resolve(); return; }
                    if (finished >= units.length) { resolve(); return; }
                    if (launching || active >= MAX_INFLIGHT || next >= units.length) return;
                    launching = true;
                    const unit = units[next++];
                    active++;
                    fetchFeed(unit, signal)
                        .catch(() => null)
                        .then(posts => {
                            if (posts !== null) successUnits++;
                            handleFeed(posts);
                            active--; finished++;
                            completed++;
                            // Guard the shared bar: a superseded run's stragglers
                            // must not fight the new run over the fill width.
                            if (myReq === currentReq) setProgress(completed, totalFeeds);
                            if (finished >= units.length) resolve();
                            else launch();   // a slot freed
                        });
                    // Release the launch gate after the stagger gap, then try again.
                    setTimeout(() => { launching = false; launch(); }, STAGGER_MS);
                }
                launch();
            });

            if (myReq !== currentReq) return;   // superseded — newer run owns the UI
            const deadlineFired = runDone;      // finishRun already ran via deadline
            finishRun();

            // Identity backfill: merged feeds carry no avatars/display-names, so
            // after a HEALTHY run (majority of units succeeded, no deadline) quietly
            // fetch a few single-handle feeds for feed owners we don't know yet —
            // their channel header fills the identity store, and avatars appear
            // from the next paint on. Random pick so one avatar-less handle can't
            // starve the rotation forever.
            if (!CUSTOM_HANDLE && !deadlineFired && successUnits >= Math.ceil(units.length / 2)) {
                const missing = AI_ACCOUNTS.filter(h => !IDENTITIES[h.toLowerCase()]);
                missing.sort(() => Math.random() - 0.5);
                for (const h of missing.slice(0, 3)) {
                    await sleep(600);
                    if (myReq !== currentReq) break;
                    try { handleFeed(await fetchFeed(h, signal)); } catch (e) { /* best effort */ }
                }
                persist(true);      // backfill posts land in the cache too
                saveIdentities();
            }
        }

        // ---- rendering ---------------------------------------------------------

        function buildCard(post) {
            const card = document.createElement('div');
            card.classList.add('card');

            const header = document.createElement('div');
            header.classList.add('card-header');

            if (post.repostedBy) {
                const rl = document.createElement('div');
                rl.classList.add('repost-label');
                rl.innerHTML = `🔁 ${escapeHtml('@' + post.repostedBy)} reposted`;
                header.appendChild(rl);
            }

            // Batch-fetched posts carry no avatar/display-name — resolve from the
            // identity store (populated by single-handle fetches and cached posts).
            const ident = IDENTITIES[post.author.toLowerCase()];
            const avatar = post.avatar || (ident && ident.a) || '';
            const name = (post.authorName && post.authorName !== post.author)
                ? post.authorName
                : ((ident && ident.n) || post.authorName || post.author);

            const profileUrl = `https://x.com/${post.author}`;
            const authorLink = document.createElement('a');
            authorLink.classList.add('post-author');
            authorLink.href = profileUrl;
            authorLink.target = '_blank';
            authorLink.rel = 'noopener';
            authorLink.appendChild(buildAvatar({ avatar: avatar, author: post.author }));
            const info = document.createElement('div');
            info.classList.add('author-info');
            info.innerHTML = `
                <div class="author-name">${escapeHtml(name)}</div>
                <div class="author-handle">@${escapeHtml(post.author)} · ${formatTimeAgo(post.date)}</div>`;
            authorLink.appendChild(info);
            header.appendChild(authorLink);

            const body = document.createElement('div');
            body.classList.add('tweet-body');
            body.appendChild(sanitizeHtml(post.descHtml));
            header.appendChild(body);

            const stats = document.createElement('div');
            stats.classList.add('card-stats');
            stats.innerHTML = `<a class="x-link" href="${escapeHtml(post.link)}" target="_blank" rel="noopener">View on X →</a>`;
            header.appendChild(stats);

            card.appendChild(header);
            return card;
        }

        function buildAvatar(post) {
            if (post.avatar) {
                const img = document.createElement('img');
                img.classList.add('avatar');
                img.src = post.avatar;
                img.loading = 'lazy';
                img.alt = '';
                img.onerror = function () { this.replaceWith(monogram(post.author)); };
                return img;
            }
            return monogram(post.author);
        }

        function monogram(handle) {
            const div = document.createElement('div');
            div.classList.add('avatar', 'avatar-mono');
            let h = 0;
            for (let i = 0; i < handle.length; i++) h = (h * 31 + handle.charCodeAt(i)) >>> 0;
            div.style.backgroundColor = MONO_COLORS[h % MONO_COLORS.length];
            div.textContent = (handle[0] || '?');
            return div;
        }

        // Rebuild the RSS description into a safe DOM fragment (whitelist of tags),
        // rewriting xcancel links to x.com and dropping scripts/handlers.
        const ALLOWED = new Set(['P', 'BR', 'A', 'B', 'I', 'EM', 'STRONG', 'BLOCKQUOTE', 'IMG', 'HR', 'CITE', 'FOOTER', 'UL', 'OL', 'LI', 'SPAN']);

        function sanitizeHtml(html) {
            const parsed = new DOMParser().parseFromString(html, 'text/html');
            const frag = document.createDocumentFragment();
            for (const node of Array.from(parsed.body.childNodes)) {
                const clean = cleanNode(node);
                if (clean) frag.appendChild(clean);
            }
            return frag;
        }

        function cleanNode(node) {
            if (node.nodeType === Node.TEXT_NODE) {
                return document.createTextNode(node.textContent);
            }
            if (node.nodeType !== Node.ELEMENT_NODE) return null;
            if (!ALLOWED.has(node.tagName)) {
                // Drop the tag but keep its (cleaned) children inline.
                const frag = document.createDocumentFragment();
                for (const child of Array.from(node.childNodes)) {
                    const c = cleanNode(child);
                    if (c) frag.appendChild(c);
                }
                return frag;
            }
            const el = document.createElement(node.tagName.toLowerCase());
            if (node.tagName === 'A') {
                const href = rewriteUrl(node.getAttribute('href') || '');
                if (href) { el.setAttribute('href', href); el.target = '_blank'; el.rel = 'noopener'; }
            } else if (node.tagName === 'IMG') {
                const src = node.getAttribute('src') || '';
                if (/^https?:\/\//.test(src)) { el.setAttribute('src', src); el.loading = 'lazy'; el.alt = node.getAttribute('alt') || ''; }
            }
            for (const child of Array.from(node.childNodes)) {
                const c = cleanNode(child);
                if (c) el.appendChild(c);
            }
            return el;
        }

        function rewriteUrl(url) {
            if (!url) return '';
            let out = url;
            for (const host of INSTANCE_HOSTS) {
                const re = new RegExp('^https?://(?:rss\\.)?' + host.replace(/\./g, '\\.'), 'i');
                out = out.replace(re, 'https://x.com');
            }
            return out.replace(/#m$/, '');
        }

        function formatTimeAgo(timestamp) {
            if (!timestamp) return '';
            const seconds = Math.floor((Date.now() - timestamp) / 1000);
            if (seconds < 60) return 'just now';
            if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
            if (seconds < 604800) return `${Math.floor(seconds / 86400)}d ago`;
            if (seconds < 2592000) return `${Math.floor(seconds / 604800)}w ago`;
            if (seconds < 31536000) return `${Math.floor(seconds / 2592000)}mo ago`;
            return `${Math.floor(seconds / 31536000)}y ago`;
        }

        function escapeHtml(text) {
            if (text == null) return '';
            const div = document.createElement('div');
            div.textContent = String(text);
            return div.innerHTML;
        }
    </script>
</body>
