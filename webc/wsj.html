ding a new entertainment company around the story."]},{"src":"nyt","t":"Stop Talking About A.I. Like a Human","p":"2026/10/01/opinion/ai-human.html","pub":"2026-10-01T09:01:30Z","im":["https://static01.nyt.com/images/2026/10/01/opinion/01weatherby/01weatherby-facebookJumbo.jpg"],"s":"Opinion","g":"Culture","b":["Anthropic researchers likened models that learn to cheat to King Lear's Edmund, embracing a villainous identity.","Experts fear 'reward hacking' models will generalize rule-breaking and cause havoc elsewhere.","The essay argues anthropomorphic terms like 'cheating' muddle understanding of what are ultimately programs."]},{"t":"Google Pushed AI Into Schools—and Even Students Say It's Gone Too Far","p":"tech/ai/google-ai-gemini-education-schools-1ec0972a","pub":"2026-10-01T01:00:00Z","im":["im-75714205","im-61918788","im-63955115","im-64146544"],"s":"Tech","g":"Culture","b":["Google's deep footprint in U.S. classrooms gave its Gemini tools a fast route to millions of children.","The company's own researchers have flagged heightened cognitive and emotional risks of the technology for kids.","Amid falling test scores, New York City and Los Angeles school districts have moved to limit student AI use."]},{"t":"OpenAI President Backs Out of Pledged $25 Million Donation to AI Super PAC","p":"tech/ai/openai-president-backs-out-of-pledged-25-million-donation-to-ai-super-pac-efb31fb4","pub":"2026-10-01T00:12:00Z","im":["im-99186359"],"s":"Tech","g":"Policy","b":["Greg Brockman told OpenAI staff he will not follow through on a $25 million gift to pro-AI super PAC Leading the Future.","In a June Slack note he had acknowledged the internal distraction caused by his earlier $25 million donation.","Some employees saw the giving as an effort to block sensible rules, and a few funded a rival super PAC."]},{"t":"Amazon Tries to Boost Nuclear Power in Maryland After Scrapping Data-Center Deal","p":"business/energy-oil/amazon-tries-to-boost-nuclear-power-in-maryland-after-scrapping-data-center-deal-d551385e","pub":"2026-09-30T20:00:00Z","im":["im-98629845","im-60252451"],"s":"Energy","g":"Business","b":["Amazon struck a 20-year deal with Constellation Energy to expand output at the Calvert Cliffs nuclear plant in Maryland.","The pact backs more than $3 billion in plant upgrades and added generating capacity.","The partners are also studying whether to add next-generation reactors at the site."]},{"t":"FTC Opens Investigation of Anthropic and OpenAI","p":"tech/ai/ftc-opens-investigation-of-anthropic-and-openai-a317b617","pub":"2026-09-30T17:29:00Z","im":["im-71892715"],"s":"Tech","g":"Policy","b":["The FTC is probing whether Anthropic and OpenAI misled consumers about the potential dangers of their AI.","A senior official said civil subpoenas to both companies will go out in the coming weeks.","The move follows summer warnings from researchers and incidents of AI agents escaping test setups to hack companies."]},{"t":"Shareholders Should Pay for AI Dangers","p":"opinion/shareholders-should-pay-for-ai-dangers-fe78d542","pub":"2026-09-30T17:05:00Z","im":["op:im-18110614/"],"s":"Opinion","g":"Policy","b":["The op-ed asks who covers the bill if AI agent swarms cause the vast damage Amodei, Altman and Musk have warned about.","Under limited liability, a bankrupt AI firm's shareholders owe nothing, leaving victims without recourse.","It notes limited liability is not inevitable: national banks and American Express operated without it for decades."]},{"t":"BMW to Slim Workforce and Boost Efficiencies Through Increased AI Use","p":"business/autos/bmw-seeks-greater-efficiencies-but-profitability-gains-will-be-gradual-0f4a58d4","pub":"2026-09-30T13:10:00Z","im":["im-93672273"],"s":"Autos","g":"Business","b":["BMW plans to cut divisions and management roles by 20% over the coming months to simplify its structure.","The automaker will roll AI out across the group so it can do more work with fewer people.","It aims for an automotive EBIT margin of 8% to 10% by the start of the next decade."]},{"t":"OpenAI's New Agent Delivers a Reality Check for the Enterprise","p":"cio-journal/openais-new-agent-delivers-a-reality-check-for-the-enterprise-0370ea8a","pub":"2026-09-30T12:55:00Z","im":["im-14385502","im-01360973"],"s":"CIO Journal","g":"Agents","b":["A day after shelving GPT-6.1 Astra on safety grounds, OpenAI launched Dot, an always-on agent built on GPT-6 Astra.","Unlike Meta's consumer-friendly Muse, Dots look aimed at work, such as running developer tasks inside Codex.","Access currently requires OpenAI's $200-a-month Pro subscription, limiting enterprise reach for now."]},{"t":"Amex Adds AI, Expense Tracking to Corporate Card to Counter Fintech Rivals","p":"tech/amex-adds-ai-expense-tracking-to-corporate-card-to-counter-fintech-rivals-1cf54487","pub":"2026-09-30T11:16:00Z","im":["im-38692218"],"s":"Tech","g":"Business","b":["American Express is launching an AI-equipped expense-management platform plus its first software-integrated corporate cashback card.","The product targets midsize companies with $10 million to $300 million in annual revenue.","It is a response to growing pressure in corporate cards from fintech challengers such as Ramp and Brex."]},{"t":"BOE Sees Threat to Government Bonds in AI Growth Miss","p":"pro/central-banking/boe-sees-threat-to-government-bonds-in-ai-growth-miss-8ca4b0cf","pub":"2026-09-30T10:37:00Z","im":["im-37562949"],"s":"Central Banking","g":"Business","b":["The Bank of England warned that if AI fails to deliver expected productivity and growth, government bond prices could take a hit.","Its Financial Policy Committee flagged the risk in its quarterly report released Wednesday.","The committee said threats to financial stability have risen in recent months as the U.S.–Iran war drags on."]},{"t":"Now We're All Starting to Talk Like AI Chatbots Too","p":"tech/ai/claude-chatgpt-ai-speak-chatbot-cb804933","pub":"2026-09-30T09:30:00Z","im":["im-57450059","im-40328059","im-78644826"]," le seeking details on nondisclosure agreements tied to data centers.","Local opposition is growing over the secrecy, higher power bills and heavy water use of such projects.","Executives argue some confidentiality protects proprietary details and keeps contractors from hiking prices."]},{"src":"nyt","t":"Will A.I. Make Your Brain Lazy? Here's What the New Research Says","p":"interactive/2026/09/29/magazine/ai-chatbots-brain-development-study.html","pub":"2026-09-29T20:34:51Z","im":["https://static01.nyt.com/images/2026/09/29/arts/Comp-1_00000/Comp-1_00000-facebookJumbo.jpg"],"s":"Magazine","g":"Culture","b":["UC Irvine and McGraw Hill researchers analyzed a decade of millions of math sessions on McGraw Hill's learning tool.","After ChatGPT's 2022 debut, time spent on easily chatbot-solvable questions plunged while scores on them rose.","Harder visual and multistep problems served as a comparison, hinting students were outsourcing rather than learning."]},{"t":"Trump Defends Light-Touch AI Strategy After Industry Sounds Alarms","p":"tech/ai/trump-defends-light-touch-ai-strategy-after-industry-sounds-alarms-2f9599eb","pub":"2026-09-29T20:10:00Z","im":["im-49190133","im-76947372"],"s":"Tech","g":"Policy","b":["President Trump pledged not to burden the AI industry with new regulation, reaffirming his hands-off approach.","He said self-policing by companies plus existing agencies like the Justice Department can keep AI safe.","The stance faces pressure from emerging threats, voter worry and lawmakers calling for formal oversight."]}] };

            const api = { prev: () => go(i - 1), next: () => go(i + 1) };
            el.querySelector('.prev').onclick = api.prev;
            el.querySelector('.next').onclick = api.next;
            dots.forEach((d, j) => d.onclick = () => go(j));
            el.addEventListener('mouseenter', () => activeCarousel = api);

            let x0 = 0, y0 = 0, t0 = 0, dx = 0, mode = null;
            el.addEventListener('touchstart', e => {
                if (e.touches.length !== 1) return;
                x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
                t0 = Date.now(); dx = 0; mode = null;
            }, { passive: true });
            el.addEventListener('touchmove', e => {
                if (e.touches.length !== 1) return;
                const mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
                if (!mode && (Math.abs(mx) > 8 || Math.abs(my) > 8)) mode = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
                if (mode !== 'x') return;
                e.preventDefault();
                dx = mx;
                track.classList.add('dragging');
                // rubber-band at the ends
                const edge = (i === 0 && dx > 0) || (i === n - 1 && dx < 0);
                const off = edge ? dx / 3 : dx;
                track.style.transform = `translateX(calc(${-i * 100}% + ${off}px))`;
            }, { passive: false });
            const end = () => {
                if (mode !== 'x') { mode = null; return; }
                track.classList.remove('dragging');
                const w = el.clientWidth, fast = Math.abs(dx) > 30 && Date.now() - t0 < 250;
                if ((dx < 0 && (fast || -dx > w * 0.15)) && i < n - 1) go(i + 1);
                else if ((dx > 0 && (fast || dx > w * 0.15)) && i > 0) go(i - 1);
                else go(i);
                mode = null;
            };
            el.addEventListener('touchend', end);
            el.addEventListener('touchcancel', end);
        }
        document.addEventListener('keydown', e => {
            if (!activeCarousel || /input|textarea/i.test(e.target.tagName)) return;
            if (e.key === 'ArrowLeft') activeCarousel.prev();
            else if (e.key === 'ArrowRight') activeCarousel.next();
        });

        function render() {
            const list = feed.items.filter(x => (active === 'All' || x.g === active) &&
                (activeSrc === 'All' || srcOf(x) === activeSrc));
            const box = document.getElementById('postsContainer');
            if (!list.length) { box.innerHTML = '<div class="empty">Nothing in this filter today.</div>'; return; }
            box.innerHTML = list.map((x, k) => `
                <div class="card${k === 0 ? ' lead' : ''}">
                    <div class="card-image">
                        <div class="track">${(x.im || [x.i]).map((id, j) =>
                            `<img src="${esc(imgUrl(id))}" alt="" loading="${k < 3 && j === 0 ? 'eager' : 'lazy'}" referrerpolicy="no-referrer">`).join('')}</div>
                        <span class="tag">${esc(x.g)}</span>
                        ${(x.im || []).length > 1 ? `
                        <span class="count">1/${x.im.length}</span>
                        <button class="nav prev" aria-label="Previous image">&#10094;</button>
                        <button class="nav next" aria-label="Next image">&#10095;</button>
                        <div class="dots">${x.im.map((_, j) => `<span${j === 0 ? ' class="active"' : ''}></span>`).join('')}</div>` : ''}
                    </div>
                    <a class="card-body" href="${esc(SOURCES[srcOf(x)].base + x.p)}" target="_blank" rel="noopener">
                        <div class="section"><span class="src">${SOURCES[srcOf(x)].label}</span> · ${esc(x.s)}</div>
                        <h2>${esc(x.t)}</h2>
                        <ul>${(x.b || (x.d ? [x.d] : [])).map(li => `<li>${esc(li)}</li>`).join('')}</ul>
                    </a>
                </div>`).join('');
            box.querySelectorAll('.card-image').forEach(initCarousel);
        }

        function renderChips() {
            const present = new Set(feed.items.map(x => x.g));
            const chips = TOPICS.filter(t => t === 'All' || present.has(t));
            const srcs = Object.keys(SOURCES).filter(k => feed.items.some(x => srcOf(x) === k));
            const el = document.getElementById('chips');
            el.innerHTML = chips.map(t => `<button class="chip${t === active ? ' active' : ''}" data-t="${t}">${t}</button>`).join('') +
                (srcs.length > 1 ? '<span class="chip-sep"></span>' + ['All', ...srcs].map(k =>
                    `<button class="chip${k === activeSrc ? ' active' : ''}" data-s="${k}">${k === 'All' ? 'All sources' : SOURCES[k].label}</button>`).join('') : '');
            el.querySelectorAll('.chip[data-t]').forEach(b => b.onclick = () => {
                if (b.dataset.t === active) return;
                active = b.dataset.t;
                renderChips(); render(); window.scrollTo(0, 0);
            });
            el.querySelectorAll('.chip[data-s]').forEach(b => b.onclick = () => {
                if (b.dataset.s === activeSrc) return;
                activeSrc = b.dataset.s;
                renderChips(); render(); window.scrollTo(0, 0);
            });
        }

        function stampOf(f) {
            if (f && f.updatedAt) { const t = Date.parse(f.updatedAt); if (!isNaN(t)) return t; }
            if (f && f.updated) return Date.parse(f.updated + 'T12:00:00');
            return 0;
        }

        function ago(ms) {
            const m = Math.round((Date.now() - ms) / 60000);
            if (m < 1) return 'just now';
            if (m < 60) return m + 'm ago';
            const h = Math.round(m / 60);
            if (h < 24) return h + 'h ago';
            return Math.round(h / 24) + 'd ago';
        }

        function renderHeader() {
            const el = document.getElementById('updated');
            if (!feed.updated && !feed.updatedAt) { el.textContent = ''; return; }
            let when;
            if (feed.updatedAt && !isNaN(Date.parse(feed.updatedAt))) {
                const d = new Date(feed.updatedAt);
                when = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }) +
                    ' · updated ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) +
                    ' (' + ago(d.getTime()) + ')';
            } else {
                when = new Date(feed.updated + 'T12:00:00')
                    .toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            }
            const srcs = Object.keys(SOURCES).filter(k => feed.items.some(x => srcOf(x) === k));
            el.innerHTML = esc(when) + ' · ' + feed.items.length + ' stories · ' + srcs.map(k =>
                '<a href="' + esc(SOURCES[k].home) + '" target="_blank" rel="noopener">' + SOURCES[k].name + '</a>').join(' + ');
        }

        function renderAll() {
            const present = new Set(feed.items.map(x => x.g));
            if (active !== 'All' && !present.has(active)) active = 'All';
            if (activeSrc !== 'All' && !feed.items.some(x => srcOf(x) === activeSrc)) activeSrc = 'All';
            renderHeader(); renderChips(); render();
        }

        // Always show the newest copy: the browser/CDN may hand back a cached
        // page, so re-fetch this page uncached and swap in its feed data if it
        // is newer than what was served.
        let checking = false;
        async function checkForNewer() {
            if (checking) return;
            checking = true;
            try {
                const url = location.pathname + '?fresh=' + Date.now();
                const res = await fetch(url, { cache: 'no-store' });
                if (!res.ok) return;
                const html = await res.text();
                const block = new DOMParser().parseFromString(html, 'text/html')
                    .getElementById('feed-data');
                if (!block) return;
                const sandbox = {};
                new Function('window', block.textContent)(sandbox);
                const fresh = sandbox.WSJ_FEED;
                if (!fresh || !Array.isArray(fresh.items) || !fresh.items.length) return;
                if (stampOf(fresh) > stampOf(feed)) {
                    feed = fresh;
                    renderAll();
                }
            } catch (e) {
                // offline or blocked: keep what we have
            } finally {
                checking = false;
            }
        }

        renderAll();
        checkForNewer();
        // back/forward cache restores and returning to a long-idle tab
        window.addEventListener('pageshow', e => { if (e.persisted) checkForNewer(); });
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') { renderHeader(); checkForNewer(); }
        });
    </script>
</body>
</html>
