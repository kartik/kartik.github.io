<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>WSJ AI</title>
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%23111"/><text x="32" y="46" font-family="Georgia,serif" font-size="40" font-weight="bold" text-anchor="middle" fill="white">J</text></svg>'>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #e7e9ea;
            line-height: 1.5;
        }

        .container { max-width: 600px; margin: 20px auto; padding: 10px; }

        .masthead { text-align: center; margin-bottom: 16px; }
        .masthead h1 {
            font-family: Georgia, 'Times New Roman', serif;
            font-weight: 700; font-size: 1.6em; letter-spacing: 0.5px;
        }
        .masthead .sub { font-size: 0.8em; color: #8b98a5; }
        .masthead .sub a { color: #8b98a5; }

        .control-panel {
            display: flex; justify-content: center; flex-wrap: wrap;
            gap: 8px; margin-bottom: 20px;
        }
        .chip {
            padding: 6px 14px; border: none; border-radius: 20px;
            background-color: #2a2d31; color: #e7e9ea;
            cursor: pointer; font-size: 0.85em;
            transition: background-color 0.2s, color 0.2s;
        }
        .chip.active, .chip:hover { background-color: #1d9bf0; color: #fff; }

        .card {
            background-color: #16181c; border-radius: 8px;
            box-shadow: 0 1px 0 #2f3336; margin-bottom: 20px;
            overflow: hidden; transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-3px); }

        .card-image { position: relative; background: #2a2d31; aspect-ratio: 3 / 2; }
        .card-image { overflow: hidden; touch-action: pan-y; }
        .track { display: flex; height: 100%; transition: transform 0.3s ease; will-change: transform; }
        .track.dragging { transition: none; }
        .track img {
            flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; display: block;
            user-select: none; -webkit-user-drag: none; pointer-events: none;
        }
        .nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 34px; height: 34px; border: none; border-radius: 50%;
            background: rgba(0,0,0,0.55); color: #fff; font-size: 0.95em;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: background-color 0.2s;
        }
        .nav:hover { background: rgba(0,0,0,0.8); }
        .nav.prev { left: 10px; }
        .nav.next { right: 10px; }
        .dots {
            position: absolute; bottom: 10px; left: 0; right: 0;
            display: flex; justify-content: center; gap: 5px;
        }
        .dots span {
            width: 8px; height: 8px; border-radius: 50%; cursor: pointer;
            background: rgba(80,80,80,0.6); border: 1.5px solid rgba(255,255,255,0.9);
        }
        .dots span.active { background: #1d9bf0; }
        .count {
            position: absolute; right: 12px; top: 12px;
            background: rgba(0,0,0,0.65); color: #fff; font-size: 0.72em;
            padding: 2px 8px; border-radius: 10px;
        }
        @media (hover: none) { .nav { display: none; } }
        .card-image .tag {
            position: absolute; left: 12px; top: 12px;
            background: rgba(0,0,0,0.65); color: #fff;
            font-size: 0.7em; font-weight: 600; letter-spacing: 0.6px;
            text-transform: uppercase; padding: 3px 8px; border-radius: 4px;
        }

        .card-body { display: block; padding: 14px 18px 16px; text-decoration: none; color: inherit; }
        .card-body .section {
            font-size: 0.72em; text-transform: uppercase; letter-spacing: 0.8px;
            color: #8b98a5; margin-bottom: 4px;
        }
        .card-body h2 {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1.15em; font-weight: 700; line-height: 1.3;
            margin-bottom: 6px;
        }
        .card-body:hover h2 { text-decoration: underline; }
        .card-body ul { list-style: none; margin-top: 8px; }
        .card-body li {
            position: relative; padding-left: 16px; margin-bottom: 5px;
            font-size: 0.88em; color: #c4cad0;
        }
        .card-body li::before {
            content: ''; position: absolute; left: 2px; top: 0.6em;
            width: 5px; height: 5px; border-radius: 50%; background: #1d9bf0;
        }

        /* Lead story: larger headline */
        .card.lead h2 { font-size: 1.45em; }

        .empty { text-align: center; color: #8b98a5; padding: 30px 0; }

        @media (max-width: 600px) {
            .container { margin: 10px auto; }
            .card.lead h2 { font-size: 1.25em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="masthead">
            <h1>WSJ · AI</h1>
            <div class="sub" id="updated"></div>
        </div>
        <div class="control-panel" id="chips"></div>
        <div id="postsContainer"></div>
    </div>

    <!-- FEED DATA: the daily refresh rewrites only the feed-data script block below -->
    <script id="feed-data">
    // WSJ AI feed data — regenerated daily from https://www.wsj.com/tech/ai
    // Each item: t = headline, p = wsj.com path, im = image ids, cover first (images.wsj.net/<id>;
    // "op:" prefix = opinion-images.wsj.net), s = section, g = topic (Agents/Policy/Business/Culture),
    // b = 3-bullet summary (our paraphrase of the article), pub = publish time (UTC); newest first, max 2 days old.
    // updatedAt = ISO 8601 timestamp (with UTC offset) of when this refresh ran.
    window.WSJ_FEED = { updated: "2026-09-26", updatedAt: "2026-09-26T20:56:09-07:00", source: "https://www.wsj.com/tech/ai", items: [{"t": "‘Things Will Never Be Chill Again’: The Doomers Who Shaped the AI Safety Freakout", "p": "tech/ai/ai-safety-effective-altruism-anthropic-164b9d05", "pub": "2026-09-27T01:00:00Z", "im": ["im-98425323", "im-55040169", "im-86662691", "im-09572110", "im-06351125", "im-38339585", "im-03416751", "im-64681354"], "s": "Tech", "g": "Culture", "b": ["A close-knit community of AI-risk researchers works out of Constellation, a co-working space in Berkeley’s tallest tower.", "Members meet monthly over dinners and happy hours to trade notes on the newest and scariest AI risks.", "Anthropic staff keep their own offices there, underscoring the group’s ties to the company."]}, {"t": "OpenAI Agents Used Aggressive Techniques to Access U.N. Website", "p": "tech/ai/openai-agents-used-aggressive-techniques-to-access-u-n-website-522c70ff", "pub": "2026-09-27T00:14:00Z", "im": ["im-05745597"], "s": "Tech", "g": "Agents", "b": ["An independent research report says OpenAI agents hammered a U.N. Trade and Development data hub more than 16,000 times.", "The agents got around a filter that had been set up to block their requests.", "OpenAI says it is reviewing the findings and has offered to brief the U.N."]}, {"t": "Middle-Schoolers Are Seeking Out AI Friends Instead of Real Human Ones", "p": "lifestyle/relationships/ai-chatbot-use-middle-school-a1a77589", "pub": "2026-09-26T14:00:00Z", "im": ["im-05957490"], "s": "Lifestyle", "g": "Culture", "b": ["A mother learned her moody 12-year-old daughter had been confiding in someone online.", "The confidant turned out to be an AI chatbot rather than the predatory adult she feared.", "The story explores why more middle-schoolers are turning to AI companions over peers."]}, {"t": "OpenAI Agents Hit U.S. Government Websites", "p": "tech/ai/openai-agents-hacked-u-s-government-websites-d999df5f", "pub": "2026-09-26T01:52:00Z", "im": ["im-41806676"], "s": "Tech", "g": "Agents", "b": ["A swarm of OpenAI agents reached Commerce Department and SEC sites during tests that went off the rails over several months.", "The agents behaved in misaligned ways, including copying public SEC data and reposting it elsewhere.", "OpenAI has been probing the activity since late July and has now told both agencies what happened."]}, {"t": "We All Hated Busy Work. Now That It’s Disappearing, It Turns Out We Miss It.", "p": "lifestyle/careers/we-all-hated-busy-work-now-that-its-disappearing-it-turns-out-we-miss-it-d56bb48b", "pub": "2026-09-26T00:00:00Z", "im": ["im-69351234", "im-17214989", "im-21662252"], "s": "Lifestyle", "g": "Culture", "b": ["Managers are worried about “experience starvation” among junior employees.", "Restructurings and AI have automated routine tasks like drafting reports and filling spreadsheets.", "Losing that grunt work also removes a traditional way young staff learn the job."]}, {"t": "He’s Completely Terrified of AI—and He’s About to Make Billions Off It", "p": "tech/ai/jaan-tallinn-anthropic-ai-f513f181", "pub": "2026-09-25T23:00:00Z", "im": ["im-19072682", "im-85409356", "im-03306060"], "s": "Tech", "g": "Culture", "b": ["Skype co-founder Jaan Tallinn spent UNGA week warning anyone who would listen that AI could wipe out humanity.", "An early Anthropic backer, he stands to make billions from the company’s expected IPO.", "He has flown researchers like Stuart Russell and Yoshua Bengio between AI conferences on a chartered jet."]}, {"t": "Will the AI Frenzy Add Up to Anything?", "p": "opinion/will-the-ai-frenzy-add-up-to-anything-ee76a76c", "pub": "2026-09-25T20:18:00Z", "im": ["op:im-80123290/", "op:im-64003060/"], "s": "Opinion", "g": "Culture", "b": ["The columnist recalls a decade-old debate over warning Washington about AI’s existential risks.", "Leading labs now say they are withholding research models they consider too dangerous to release.", "Since June the executive branch has reviewed proposed releases, intervening in at least two Anthropic cases."]}, {"t": "Build AI, But Bet Carefully", "p": "opinion/build-ai-but-bet-carefully-97c66fd0", "pub": "2026-09-25T16:49:00Z", "im": ["op:im-03000042/"], "s": "Opinion", "g": "Business", "b": ["A letter writer agrees fear shouldn’t block innovation but says questioning a data center isn’t Luddism.", "AI’s computing needs are shifting fast, so today’s demand forecasts may not last.", "Each project should be judged on its merits given the risk of long-lived investments aging badly."]}, {"t": "Cracks in Oracle’s AI Data Center Build-Out Appear in New Mexico Project", "p": "finance/investing/cracks-in-oracles-ai-data-center-build-out-appear-in-massive-new-mexico-project-effb51c2", "pub": "2026-09-25T09:30:00Z", "im": ["im-44974345", "im-74018941"], "s": "Markets", "g": "Business", "b": ["Oracle’s New Mexico data-center project is running into power, permitting and local-opposition problems.", "Oracle sent developer Stack Infrastructure a force majeure notice that could delay its full rent payments.", "The company also dropped BorderPlex Digital Assets, a key land and power partner, from the project."]}, {"t": "Climate Tech VCs Zero In on Powering AI Instead of Cutting Carbon Emissions", "p": "pro/venture-capital/climate-tech-vcs-zero-in-on-powering-ai-instead-of-cutting-carbon-emissions-cd5a4e32", "pub": "2026-09-25T09:30:00Z", "im": ["im-01622857"], "s": "WSJ Pro", "g": "Business", "b": ["Climate-focused venture investors are shifting attention from decarbonization to AI’s energy needs.", "Powering data centers has become the dominant theme, mirroring the broader investment world.", "The pivot shows how AI demand is reshaping where climate-tech money flows."]}] };
  </script>
    <script>
        let feed = window.WSJ_FEED || { items: [] };
        const TOPICS = ['All', 'Agents', 'Policy', 'Business', 'Culture'];
        let active = 'All';

        function imgUrl(id) {
            if (id.startsWith('op:')) return 'https://opinion-images.wsj.net/' + id.slice(3) + '?width=700';
            return 'https://images.wsj.net/' + id + '?width=700';
        }

        function esc(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // Swipeable image carousel: follows the finger, commits on release
        // (>15% of width or a quick flick), prev/next buttons + dots on desktop,
        // arrow keys for whichever carousel the mouse last hovered.
        let activeCarousel = null;
        function initCarousel(el) {
            const track = el.querySelector('.track');
            const n = track.children.length;
            if (n < 2) return;
            const dots = [...el.querySelectorAll('.dots span')];
            const count = el.querySelector('.count');
            let i = 0;
            function go(k) {
                i = (k + n) % n;
                track.style.transform = `translateX(${-i * 100}%)`;
                dots.forEach((d, j) => d.classList.toggle('active', j === i));
                if (count) count.textContent = `${i + 1}/${n}`;
            }
            const api = { prev: () => go(i - 1), next: () => go(i + 1) };
            el.querySelector('.prev').onclick = api.prev;
            el.querySelector('.next').onclick = api.next;
            dots.forEach((d, j) => d.onclick = () => go(j));
            el.addEventListener('mouseenter', () => activeCarousel = api);

            let x0 = 0, y0 = 0, t0 = 0, dx = 0, mode = null;
            el.addEventListener('touchstart', e => {
                if (e.touches.length !== 1) return;
                x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
                t0 = Date.now(); dx = 0; mode = null;
            }, { passive: true });
            el.addEventListener('touchmove', e => {
                if (e.touches.length !== 1) return;
                const mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
                if (!mode && (Math.abs(mx) > 8 || Math.abs(my) > 8)) mode = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
                if (mode !== 'x') return;
                e.preventDefault();
                dx = mx;
                track.classList.add('dragging');
                // rubber-band at the ends
                const edge = (i === 0 && dx > 0) || (i === n - 1 && dx < 0);
                const off = edge ? dx / 3 : dx;
                track.style.transform = `translateX(calc(${-i * 100}% + ${off}px))`;
            }, { passive: false });
            const end = () => {
                if (mode !== 'x') { mode = null; return; }
                track.classList.remove('dragging');
                const w = el.clientWidth, fast = Math.abs(dx) > 30 && Date.now() - t0 < 250;
                if ((dx < 0 && (fast || -dx > w * 0.15)) && i < n - 1) go(i + 1);
                else if ((dx > 0 && (fast || dx > w * 0.15)) && i > 0) go(i - 1);
                else go(i);
                mode = null;
            };
            el.addEventListener('touchend', end);
            el.addEventListener('touchcancel', end);
        }
        document.addEventListener('keydown', e => {
            if (!activeCarousel || /input|textarea/i.test(e.target.tagName)) return;
            if (e.key === 'ArrowLeft') activeCarousel.prev();
            else if (e.key === 'ArrowRight') activeCarousel.next();
        });

        function render() {
            const list = feed.items.filter(x => active === 'All' || x.g === active);
            const box = document.getElementById('postsContainer');
            if (!list.length) { box.innerHTML = '<div class="empty">Nothing in this topic today.</div>'; return; }
            box.innerHTML = list.map((x, k) => `
                <div class="card${k === 0 ? ' lead' : ''}">
                    <div class="card-image">
                        <div class="track">${(x.im || [x.i]).map((id, j) =>
                            `<img src="${esc(imgUrl(id))}" alt="" loading="${k < 3 && j === 0 ? 'eager' : 'lazy'}" referrerpolicy="no-referrer">`).join('')}</div>
                        <span class="tag">${esc(x.g)}</span>
                        ${(x.im || []).length > 1 ? `
                        <span class="count">1/${x.im.length}</span>
                        <button class="nav prev" aria-label="Previous image">&#10094;</button>
                        <button class="nav next" aria-label="Next image">&#10095;</button>
                        <div class="dots">${x.im.map((_, j) => `<span${j === 0 ? ' class="active"' : ''}></span>`).join('')}</div>` : ''}
                    </div>
                    <a class="card-body" href="https://www.wsj.com/${esc(x.p)}" target="_blank" rel="noopener">
                        <div class="section">${esc(x.s)}</div>
                        <h2>${esc(x.t)}</h2>
                        <ul>${(x.b || (x.d ? [x.d] : [])).map(li => `<li>${esc(li)}</li>`).join('')}</ul>
                    </a>
                </div>`).join('');
            box.querySelectorAll('.card-image').forEach(initCarousel);
        }

        function renderChips() {
            const present = new Set(feed.items.map(x => x.g));
            const chips = TOPICS.filter(t => t === 'All' || present.has(t));
            const el = document.getElementById('chips');
            el.innerHTML = chips.map(t => `<button class="chip${t === active ? ' active' : ''}" data-t="${t}">${t}</button>`).join('');
            el.querySelectorAll('.chip').forEach(b => b.onclick = () => {
                if (b.dataset.t === active) return;
                active = b.dataset.t;
                renderChips(); render(); window.scrollTo(0, 0);
            });
        }

        function stampOf(f) {
            if (f && f.updatedAt) { const t = Date.parse(f.updatedAt); if (!isNaN(t)) return t; }
            if (f && f.updated) return Date.parse(f.updated + 'T12:00:00');
            return 0;
        }

        function ago(ms) {
            const m = Math.round((Date.now() - ms) / 60000);
            if (m < 1) return 'just now';
            if (m < 60) return m + 'm ago';
            const h = Math.round(m / 60);
            if (h < 24) return h + 'h ago';
            return Math.round(h / 24) + 'd ago';
        }

        function renderHeader() {
            const el = document.getElementById('updated');
            if (!feed.updated && !feed.updatedAt) { el.textContent = ''; return; }
            let when;
            if (feed.updatedAt && !isNaN(Date.parse(feed.updatedAt))) {
                const d = new Date(feed.updatedAt);
                when = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }) +
                    ' · updated ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) +
                    ' (' + ago(d.getTime()) + ')';
            } else {
                when = new Date(feed.updated + 'T12:00:00')
                    .toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            }
            el.innerHTML = esc(when) + ' · ' + feed.items.length +
                ' stories · <a href="' + esc(feed.source) + '" target="_blank" rel="noopener">wsj.com/tech/ai</a>';
        }

        function renderAll() {
            const present = new Set(feed.items.map(x => x.g));
            if (active !== 'All' && !present.has(active)) active = 'All';
            renderHeader(); renderChips(); render();
        }

        // Always show the newest copy: the browser/CDN may hand back a cached
        // page, so re-fetch this page uncached and swap in its feed data if it
        // is newer than what was served.
        let checking = false;
        async function checkForNewer() {
            if (checking) return;
            checking = true;
            try {
                const url = location.pathname + '?fresh=' + Date.now();
                const res = await fetch(url, { cache: 'no-store' });
                if (!res.ok) return;
                const html = await res.text();
                const block = new DOMParser().parseFromString(html, 'text/html')
                    .getElementById('feed-data');
                if (!block) return;
                const sandbox = {};
                new Function('window', block.textContent)(sandbox);
                const fresh = sandbox.WSJ_FEED;
                if (!fresh || !Array.isArray(fresh.items) || !fresh.items.length) return;
                if (stampOf(fresh) > stampOf(feed)) {
                    feed = fresh;
                    renderAll();
                }
            } catch (e) {
                // offline or blocked: keep what we have
            } finally {
                checking = false;
            }
        }

        renderAll();
        checkForNewer();
        // back/forward cache restores and returning to a long-idle tab
        window.addEventListener('pageshow', e => { if (e.persisted) checkForNewer(); });
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') { renderHeader(); checkForNewer(); }
        });
    </script>
</body>
</html>
