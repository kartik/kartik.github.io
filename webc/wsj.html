        * { box-sizing: border-box; margin: 0; padding: 0; }

        .card-image { position: relative; background: #2a2d31; aspect-ratio: 3 / 2; }
        .card-image { overflow: hidden; touch-action: pan-y; }
        .track { display: flex; height: 100%; transition: transform 0.3s ease; will-change: transform; }
        .track.dragging { transition: none; }
        .track img {
            flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; display: block;
            user-select: none; -webkit-user-drag: none; pointer-events: none;
        }
        .nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 34px; height: 34px; border: none; border-radius: 50%;
            background: rgba(0,0,0,0.55); color: #fff; font-size: 0.95em;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: background-color 0.2s;
        }
        .nav:hover { background: rgba(0,0,0,0.8); }
        .nav.prev { left: 10px; }
        .nav.next { right: 10px; }
        .dots {
            position: absolute; bottom: 10px; left: 0; right: 0;
            display: flex; justify-content: center; gap: 5px;
        }
        .dots span {
            width: 8px; height: 8px; border-radius: 50%; cursor: pointer;
            background: rgba(80,80,80,0.6); border: 1.5px solid rgba(255,255,255,0.9);
        }
        .dots span.active { background: #1d9bf0; }
        .count {
            position: absolute; right: 12px; top: 12px;
            background: rgba(0,0,0,0.65); color: #fff; font-size: 0.72em;
            padding: 2px 8px; border-radius: 10px;
        }
        @media (hover: none) { .nav { display: none; } }
        .card-image .tag {
            position: absolute; left: 12px; top: 12px;
            background: rgba(0,0,0,0.65); color: #fff;
            font-size: 0.7em; font-weight: 600; letter-spacing: 0.6px;
            text-transform: uppercase; padding: 3px 8px; border-radius: 4px;
        }

        .card-body { display: block; padding: 14px 18px 16px; text-decoration: none; color: inherit; }
        .card-body .section {
            font-size: 0.72em; text-transform: uppercase; letter-spacing: 0.8px;
            color: #8b98a5; margin-bottom: 4px;
        }

        .card-body:hover h2 { text-decoration: underline; }
        .card-body ul { list-style: none; margin-top: 8px; }
        .card-body li {
            position: relative; padding-left: 16px; margin-bottom: 5px;
            font-size: 0.88em; color: #c4cad0;
        }
        .card-body li::before {
            content: ''; position: absolute; left: 2px; top: 0.6em;
            width: 5px; height: 5px; border-radius: 50%; background: #1d9bf0;
        }

        /* Lead story: larger headline */
        .card.lead h2 { font-size: 1.45em; }

        .empty { text-align: center; color: #8b98a5; padding: 30px 0; }

        @media (max-width: 600px) {
            .container { margin: 10px auto; }

    <script>
        let feed = window.WSJ_FEED || { items: [] };
        const TOPICS = ['All', 'Agents', 'Policy', 'Business', 'Culture'];
        // src: 'wsj' (default when missing) or 'nyt'
        const SOURCES = {
            wsj: { label: 'WSJ', base: 'https://www.wsj.com/', home: 'https://www.wsj.com/tech/ai', name: 'wsj.com/tech/ai' },
            nyt: { label: 'NYT', base: 'https://www.nytimes.com/', home: 'https://www.nytimes.com/spotlight/artificial-intelligence', name: 'nytimes.com' }
        };
        let active = 'All', activeSrc = 'All';
        const srcOf = x => SOURCES[x.src] ? x.src : 'wsj';

        function imgUrl(id) {
            if (/^https:\/\//.test(id)) return id;
            if (id.startsWith('op:')) return 'https://opinion-images.wsj.net/' + id.slice(3) + '?width=700';
            return 'https://images.wsj.net/' + id + '?width=700';
        }

        function esc(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // Swipeable image carousel: follows the finger, commits on release
        // (>15% of width or a quick flick), prev/next buttons + dots on desktop,
        // arrow keys for whichever carousel the mouse last hovered.
        let activeCarousel = null;
        function initCarousel(el) {
            const track = el.querySelector('.track');
            const n = track.children.length;
            if (n < 2) return;
            const dots = [...el.querySelectorAll('.dots span')];
            const count = el.querySelector('.count');
            let i = 0;
            function go(k) {
                i = (k + n) % n;
                track.style.transform = `translateX(${-i * 100}%)`;
                dots.forEach((d, j) => d.classList.toggle('active', j === i));
                if (count) count.textContent = `${i + 1}/${n}`;
            }
            const api = { prev: () => go(i - 1), next: () => go(i + 1) };
            el.querySelector('.prev').onclick = api.prev;
            el.querySelector('.next').onclick = api.next;
            dots.forEach((d, j) => d.onclick = () => go(j));
            el.addEventListener('mouseenter', () => activeCarousel = api);

            let x0 = 0, y0 = 0, t0 = 0, dx = 0, mode = null;
            el.addEventListener('touchstart', e => {
                if (e.touches.length !== 1) return;
                x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
                t0 = Date.now(); dx = 0; mode = null;
            }, { passive: true });
            el.addEventListener('touchmove', e => {
                if (e.touches.length !== 1) return;
                const mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
                if (!mode && (Math.abs(mx) > 8 || Math.abs(my) > 8)) mode = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
                if (mode !== 'x') return;
                e.preventDefault();
                dx = mx;
                track.classList.add('dragging');
                // rubber-band at the ends
                const edge = (i === 0 && dx > 0) || (i === n - 1 && dx < 0);
                const off = edge ? dx / 3 : dx;
                track.style.transform = `translateX(calc(${-i * 100}% + ${off}px))`;
            }, { passive: false });
            const end = () => {
                if (mode !== 'x') { mode = null; return; }
                track.classList.remove('dragging');
                const w = el.clientWidth, fast = Math.abs(dx) > 30 && Date.now() - t0 < 250;
                if ((dx < 0 && (fast || -dx > w * 0.15)) && i < n - 1) go(i + 1);
                else if ((dx > 0 && (fast || dx > w * 0.15)) && i > 0) go(i - 1);
                else go(i);
                mode = null;
            };
            el.addEventListener('touchend', end);
            el.addEventListener('touchcancel', end);
        }
        document.addEventListener('keydown', e => {
            if (!activeCarousel || /input|textarea/i.test(e.target.tagName)) return;
            if (e.key === 'ArrowLeft') activeCarousel.prev();
            else if (e.key === 'ArrowRight') activeCarousel.next();
        });

        function render() {
            const list = feed.items.filter(x => (active === 'All' || x.g === active) &&
                (activeSrc === 'All' || srcOf(x) === activeSrc));
            const box = document.getElementById('postsContainer');
            if (!list.length) { box.innerHTML = '<div class="empty">Nothing in this filter today.</div>'; return; }
            box.innerHTML = list.map((x, k) => `
                <div class="card${k === 0 ? ' lead' : ''}">
                    <div class="card-image">
                        <div class="track">${(x.im || [x.i]).map((id, j) =>
                            `<img src="${esc(imgUrl(id))}" alt="" loading="${k < 3 && j === 0 ? 'eager' : 'lazy'}" referrerpolicy="no-referrer">`).join('')}</div>
                        <span class="tag">${esc(x.g)}</span>
                        ${(x.im || []).length > 1 ? `
                        <span class="count">1/${x.im.length}</span>
                        <button class="nav prev" aria-label="Previous image">&#10094;</button>
                        <button class="nav next" aria-label="Next image">&#10095;</button>
                        <div class="dots">${x.im.map((_, j) => `<span${j === 0 ? ' class="active"' : ''}></span>`).join('')}</div>` : ''}
                    </div>
                    <a class="card-body" href="${esc(SOURCES[srcOf(x)].base + x.p)}" target="_blank" rel="noopener">
                        <div class="section"><span class="src">${SOURCES[srcOf(x)].label}</span> · ${esc(x.s)}</div>
                        <h2>${esc(x.t)}</h2>
                        <ul>${(x.b || (x.d ? [x.d] : [])).map(li => `<li>${esc(li)}</li>`).join('')}</ul>
                    </a>
                </div>`).join('');
            box.querySelectorAll('.card-image').forEach(initCarousel);
        }

        function renderChips() {
            const present = new Set(feed.items.map(x => x.g));
            const chips = TOPICS.filter(t => t === 'All' || present.has(t));
            const srcs = Object.keys(SOURCES).filter(k => feed.items.some(x => srcOf(x) === k));
            const el = document.getElementById('chips');
            el.innerHTML = chips.map(t => `<button class="chip${t === active ? ' active' : ''}" data-t="${t}">${t}</button>`).join('') +
                (srcs.length > 1 ? '<span class="chip-sep"></span>' + ['All', ...srcs].map(k =>
                    `<button class="chip${k === activeSrc ? ' active' : ''}" data-s="${k}">${k === 'All' ? 'All sources' : SOURCES[k].label}</button>`).join('') : '');
            el.querySelectorAll('.chip[data-t]').forEach(b => b.onclick = () => {
                if (b.dataset.t === active) return;
                active = b.dataset.t;
                renderChips(); render(); window.scrollTo(0, 0);
            });
            el.querySelectorAll('.chip[data-s]').forEach(b => b.onclick = () => {
                if (b.dataset.s === activeSrc) return;
                activeSrc = b.dataset.s;
                renderChips(); render(); window.scrollTo(0, 0);
            });
        }

        function stampOf(f) {
            if (f && f.updatedAt) { const t = Date.parse(f.updatedAt); if (!isNaN(t)) return t; }
            if (f && f.updated) return Date.parse(f.updated + 'T12:00:00');
            return 0;
        }

        function ago(ms) {
            const m = Math.round((Date.now() - ms) / 60000);
            if (m < 1) return 'just now';
            if (m < 60) return m + 'm ago';
            const h = Math.round(m / 60);
            if (h < 24) return h + 'h ago';
            return Math.round(h / 24) + 'd ago';
        }

        function renderHeader() {
            const el = document.getElementById('updated');
            if (!feed.updated && !feed.updatedAt) { el.textContent = ''; return; }
            let when;
            if (feed.updatedAt && !isNaN(Date.parse(feed.updatedAt))) {
                const d = new Date(feed.updatedAt);
                when = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }) +
                    ' · updated ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) +
                    ' (' + ago(d.getTime()) + ')';
            } else {
                when = new Date(feed.updated + 'T12:00:00')
                    .toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            }
            const srcs = Object.keys(SOURCES).filter(k => feed.items.some(x => srcOf(x) === k));
            el.innerHTML = esc(when) + ' · ' + feed.items.length + ' stories · ' + srcs.map(k =>
                '<a href="' + esc(SOURCES[k].home) + '" target="_blank" rel="noopener">' + SOURCES[k].name + '</a>').join(' + ');
        }

        function renderAll() {
            const present = new Set(feed.items.map(x => x.g));
            if (active !== 'All' && !present.has(active)) active = 'All';
            if (activeSrc !== 'All' && !feed.items.some(x => srcOf(x) === activeSrc)) activeSrc = 'All';
            renderHeader(); renderChips(); render();
        }

        // Always show the newest copy: the browser/CDN may hand back a cached
        // page, so re-fetch this page uncached and swap in its feed data if it
        // is newer than what was served.
        let checking = false;
        async function checkForNewer() {
            if (checking) return;
            checking = true;
            try {
                const url = location.pathname + '?fresh=' + Date.now();
                const res = await fetch(url, { cache: 'no-store' });
                if (!res.ok) return;
                const html = await res.text();
                const block = new DOMParser().parseFromString(html, 'text/html')
                    .getElementById('feed-data');
                if (!block) return;
                const sandbox = {};
                new Function('window', block.textContent)(sandbox);
                const fresh = sandbox.WSJ_FEED;
                if (!fresh || !Array.isArray(fresh.items) || !fresh.items.length) return;
                if (stampOf(fresh) > stampOf(feed)) {
                    feed = fresh;
                    renderAll();
                }
            } catch (e) {
                // offline or blocked: keep what we have
            } finally {
                checking = false;
            }
        }

        renderAll();
        checkForNewer();
        // back/forward cache restores and returning to a long-idle tab
        window.addEventListener('pageshow', e => { if (e.persisted) checkForNewer(); });
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') { renderHeader(); checkForNewer(); }
        });
    </script>
</body>
</html>
