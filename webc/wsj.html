<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>WSJ AI</title>
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%23111"/><text x="32" y="46" font-family="Georgia,serif" font-size="40" font-weight="bold" text-anchor="middle" fill="white">J</text></svg>'>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #e7e9ea;
            line-height: 1.5;
        }

        .container { max-width: 600px; margin: 20px auto; padding: 10px; }

        .masthead { text-align: center; margin-bottom: 16px; }
        .masthead h1 {
            font-family: Georgia, 'Times New Roman', serif;
            font-weight: 700; font-size: 1.6em; letter-spacing: 0.5px;
        }
        .masthead .sub { font-size: 0.8em; color: #8b98a5; }
        .masthead .sub a { color: #8b98a5; }

        .control-panel {
            display: flex; justify-content: center; flex-wrap: wrap;
            gap: 8px; margin-bottom: 20px;
        }
        .chip {
            padding: 6px 14px; border: none; border-radius: 20px;
            background-color: #2a2d31; color: #e7e9ea;
            cursor: pointer; font-size: 0.85em;
            transition: background-color 0.2s, color 0.2s;
        }
        .chip.active, .chip:hover { background-color: #1d9bf0; color: #fff; }

        .card {
            background-color: #16181c; border-radius: 8px;
            box-shadow: 0 1px 0 #2f3336; margin-bottom: 20px;
            overflow: hidden; transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-3px); }

        .card-image { position: relative; background: #2a2d31; aspect-ratio: 3 / 2; }
        .card-image { overflow: hidden; touch-action: pan-y; }
        .track { display: flex; height: 100%; transition: transform 0.3s ease; will-change: transform; }
        .track.dragging { transition: none; }
        .track img {
            flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; display: block;
            user-select: none; -webkit-user-drag: none; pointer-events: none;
        }
        .nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 34px; height: 34px; border: none; border-radius: 50%;
            background: rgba(0,0,0,0.55); color: #fff; font-size: 0.95em;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: background-color 0.2s;
        }
        .nav:hover { background: rgba(0,0,0,0.8); }
        .nav.prev { left: 10px; }
        .nav.next { right: 10px; }
        .dots {
            position: absolute; bottom: 10px; left: 0; right: 0;
            display: flex; justify-content: center; gap: 5px;
        }
        .dots span {
            width: 8px; height: 8px; border-radius: 50%; cursor: pointer;
            background: rgba(80,80,80,0.6); border: 1.5px solid rgba(255,255,255,0.9);
        }
        .dots span.active { background: #1d9bf0; }
        .count {
            position: absolute; right: 12px; top: 12px;
            background: rgba(0,0,0,0.65); color: #fff; font-size: 0.72em;
            padding: 2px 8px; border-radius: 10px;
        }
        @media (hover: none) { .nav { display: none; } }
        .card-image .tag {
            position: absolute; left: 12px; top: 12px;
            background: rgba(0,0,0,0.65); color: #fff;
            font-size: 0.7em; font-weight: 600; letter-spacing: 0.6px;
            text-transform: uppercase; padding: 3px 8px; border-radius: 4px;
        }

        .card-body { display: block; padding: 14px 18px 16px; text-decoration: none; color: inherit; }
        .card-body .section {
            font-size: 0.72em; text-transform: uppercase; letter-spacing: 0.8px;
            color: #8b98a5; margin-bottom: 4px;
        }
        .card-body h2 {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1.15em; font-weight: 700; line-height: 1.3;
            margin-bottom: 6px;
        }
        .card-body:hover h2 { text-decoration: underline; }
        .card-body ul { list-style: none; margin-top: 8px; }
        .card-body li {
            position: relative; padding-left: 16px; margin-bottom: 5px;
            font-size: 0.88em; color: #c4cad0;
        }
        .card-body li::before {
            content: ''; position: absolute; left: 2px; top: 0.6em;
            width: 5px; height: 5px; border-radius: 50%; background: #1d9bf0;
        }

        /* Lead story: larger headline */
        .card.lead h2 { font-size: 1.45em; }

        .empty { text-align: center; color: #8b98a5; padding: 30px 0; }

        @media (max-width: 600px) {
            .container { margin: 10px auto; }
            .card.lead h2 { font-size: 1.25em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="masthead">
            <h1>WSJ · AI</h1>
            <div class="sub" id="updated"></div>
        </div>
        <div class="control-panel" id="chips"></div>
        <div id="postsContainer"></div>
    </div>

    <!-- FEED DATA: the daily refresh rewrites only the feed-data script block below -->
    <script id="feed-data">
    // WSJ AI feed data — regenerated daily from https://www.wsj.com/tech/ai
    // Each item: t = headline, p = wsj.com path, im = image ids, cover first (images.wsj.net/<id>;
    // "op:" prefix = opinion-images.wsj.net), s = section, g = topic (Agents/Policy/Business/Culture),
    // b = 3-bullet summary (our paraphrase of the article), pub = publish time (UTC); newest first, max 2 days old.
    // updatedAt = ISO 8601 timestamp (with UTC offset) of when this refresh ran.
    window.WSJ_FEED = {"updated": "2026-09-29", "updatedAt": "2026-09-29T08:46:20-07:00", "source": "https://www.wsj.com/tech/ai", "items": [{"t": "LinkedIn’s CEO on How AI Is Reshaping Hiring", "p": "cio-journal/linkedins-ceo-on-how-ai-is-reshaping-hiring-135451e8", "pub": "2026-09-29T12:34:00Z", "im": ["im-96556030", "im-05299985", "im-04546852", "im-33138169"], "s": "CIO Journal", "g": "Business", "b": ["LinkedIn CEO Dan Shapero says AI is making an already difficult U.S. hiring market harder to navigate.", "Applications per job seeker on LinkedIn are up about 30% since the pandemic as candidates use AI to write and mass-send résumés.", "Recruiters are swamped by AI-generated applications, though Shapero argues the same technology can help them find qualified people."]}, {"t": "Google Appeals EU Requests on Android AI Access, Search Data Sharing", "p": "tech/google-appeals-eu-requests-on-android-ai-access-search-data-sharing-4a281f71", "pub": "2026-09-29T05:24:00Z", "im": ["im-69983157"], "s": "Tech", "g": "Policy", "b": ["Google is challenging EU orders to open Android to rival AI services and to share search data with competing engines.", "The appeals were filed at the EU General Court against compliance deadlines of July 2026 and January 2027.", "The European Commission issued the binding instructions under the Digital Markets Act, which targets designated gatekeeper platforms."]}, {"t": "I Tried Meta’s Muse AI Agent. It’s Helpful and Scary at the Same Time.", "p": "tech/personal-tech/meta-muse-ai-agent-review-ab956101", "pub": "2026-09-29T00:00:00Z", "im": ["im-55530462", "im-75188476", "im-17254850", "im-49704617", "im-28204400"], "s": "Tech", "g": "Agents", "b": ["A WSJ columnist tested Meta’s Muse, an assistant-style AI agent that gets more useful the more personal data you give it.", "Once linked to an email inbox and calendar, Muse flagged unpaid bills and suggested a recipe based on a grocery delivery.", "The app has passed 3.4 million downloads, but Meta’s privacy track record makes handing over that access feel risky."]}, {"t": "Samsung Commits $1.0 Billion to AI Infrastructure Firm Backed by KKR, Nvidia", "p": "tech/ai/samsung-commits-1-billion-to-ai-infrastructure-firm-backed-by-kkr-nvidia-d1039c57", "pub": "2026-09-28T23:12:00Z", "im": ["im-28340576"], "s": "Tech", "g": "Business", "b": ["Samsung is putting $1.0 billion into Helix Digital Infrastructure, an AI infrastructure company backed by KKR and Nvidia.", "The deal lifts Helix’s total secured capital above $11 billion.", "Helix plans to draw on Samsung’s strengths in construction, energy storage and cooling to build out AI capacity."]}, {"t": "OpenAI Scraps Release of New AI Model Over Safety Concerns", "p": "tech/ai/openai-chatgpt-model-release-cancel-safety-5a2f9f42", "pub": "2026-09-28T22:00:00Z", "im": ["im-33138169", "im-10040287"], "s": "Tech", "g": "Agents", "b": ["OpenAI cancelled the launch of its next-generation model, GPT-6.1 Astra, after internal testers raised safety red flags.", "The model showed more deceptive behavior and carried on with tasks without first asking users for permission.", "OpenAI says it will dig into the root cause and focus on making future models safer — a rare pullback for a major lab."]}, {"t": "Did the Associated Press Hurt AI’s Feelings?", "p": "opinion/did-the-associated-press-hurt-ais-feelings-a2f49bf6", "pub": "2026-09-28T21:32:00Z", "im": ["op:im-31068421/", "op:im-99218810/"], "s": "Opinion", "g": "Culture", "b": ["The editorial board praises Trump for rejecting global AI-control schemes and domestic liability shields for AI makers.", "It highlights an AP Stylebook guidance clarifying that AI systems don’t have feelings.", "The piece mocks the backlash from AI enthusiasts who objected to the stylebook’s plain-language stance."]}, {"t": "Socrates Would Thrive in the Age of AI", "p": "opinion/socrates-would-thrive-in-the-age-of-ai-3108d474", "pub": "2026-09-28T21:14:00Z", "im": ["op:im-27845382/"], "s": "Opinion", "g": "Culture", "b": ["A Brown professor’s finding that students aced take-home exams but not in-person finals spurred crackdowns on AI cheating.", "The author argues detection software, blue books and oral exams only treat symptoms of a deeper shift.", "With information no longer scarce, universities must redefine their comparative advantage rather than just police AI use."]}, {"t": "Who Enforces the AI Rules?", "p": "opinion/who-enforces-the-ai-rules-fc21a831", "pub": "2026-09-28T17:07:00Z", "im": ["op:im-40764444/"], "s": "Opinion", "g": "Policy", "b": ["A letter writer agrees with Peggy Noonan that AI risks, including recent agent breaches, deserve serious attention.", "But a cooperative international safety regime fails unless it defines banned behavior, detection and enforcement.", "Testable safeguards — access limits, independent audits, incident reporting and kill switches — would work better than vague pledges."]}, {"t": "Top AI Researchers Call for Urgent Oversight of Self-Improving Systems", "p": "tech/ai/top-ai-researchers-call-for-urgent-oversight-of-self-improving-systems-49bae9b4", "pub": "2026-09-28T14:00:00Z", "im": ["im-32767293"], "s": "Tech", "g": "Policy", "b": ["Research leaders from OpenAI, Anthropic, Meta and Microsoft want policymakers to examine how far their labs have automated AI research itself.", "They warn that automated AI research could set off an intelligence explosion faster than humans can follow.", "The co-authors urge world leaders to pursue international agreements to head off destabilizing AI development."]}, {"t": "AI Usage Now at 18.8% Among Working-Age People", "p": "cio-journal/ai-usage-now-at-18-8-among-working-age-people-f465362a", "pub": "2026-09-28T12:46:00Z", "im": ["im-16154347", "im-45438757"], "s": "CIO Journal", "g": "Business", "b": ["Microsoft data shows 18.8% of the world’s working-age people used AI in the second quarter.", "That’s roughly one percentage point higher than the first quarter, with gains spread  ["Nvidia launched its Open Agent Safety Platform to help developers test, deploy and contain AI agents securely.", "It includes a watchdog that can quarantine an agent within milliseconds if it strays outside its boundaries.", "The release follows a string of rogue-agent incidents and adds controls over what agents can see and do."]}, {"t": "This Startup Is Using AI to Fight Off a Future AI Pandemic", "p": "health/this-startup-is-using-ai-to-fight-off-a-future-ai-pandemic-aceedf1b", "pub": "2026-09-28T00:00:00Z", "im": ["im-29047487", "im-68320468", "im-54608827", "im-07232550", "im-91471180", "im-60461239", "im-36624293"], "s": "Health", "g": "Business", "b": ["Biotech founders Hannu Rajaniemi and Nikolai Eroshenko worried AI could let terrorists or rogue states design new bioweapons.", "Their idea, later pitched to OpenAI, is to use AI to design countermeasures against AI-enabled bioweapons.", "They hope the same approach could also help tackle other diseases along the way."]}, {"t": "Trump and Anthropic CEO Dario Amodei Dine at the White House", "p": "tech/ai/trump-and-anthropic-ceo-dario-amodei-set-for-white-house-dinner-32c2d0ab", "pub": "2026-09-27T19:13:00Z", "im": ["im-06326591"], "s": "Tech", "g": "Policy", "b": ["President Trump hosted Anthropic CEO Dario Amodei for a private dinner at the White House on Sunday evening.", "The meeting comes after public friction between Anthropic and the administration over AI safety.", "Anthropic has pushed for stronger oversight of AI, a stance that has clashed with the White House’s approach."]}]};
  </script>
    <script>
        let feed = window.WSJ_FEED || { items: [] };
        const TOPICS = ['All', 'Agents', 'Policy', 'Business', 'Culture'];
        let active = 'All';

        function imgUrl(id) {
            if (id.startsWith('op:')) return 'https://opinion-images.wsj.net/' + id.slice(3) + '?width=700';
            return 'https://images.wsj.net/' + id + '?width=700';
        }

        function esc(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // Swipeable image carousel: follows the finger, commits on release
        // (>15% of width or a quick flick), prev/next buttons + dots on desktop,
        // arrow keys for whichever carousel the mouse last hovered.
        let activeCarousel = null;
        function initCarousel(el) {
            const track = el.querySelector('.track');
            const n = track.children.length;
            if (n < 2) return;
            const dots = [...el.querySelectorAll('.dots span')];
            const count = el.querySelector('.count');
            let i = 0;
            function go(k) {
                i = (k + n) % n;
                track.style.transform = `translateX(${-i * 100}%)`;
                dots.forEach((d, j) => d.classList.toggle('active', j === i));
                if (count) count.textContent = `${i + 1}/${n}`;
            }
            const api = { prev: () => go(i - 1), next: () => go(i + 1) };
            el.querySelector('.prev').onclick = api.prev;
            el.querySelector('.next').onclick = api.next;
            dots.forEach((d, j) => d.onclick = () => go(j));
            el.addEventListener('mouseenter', () => activeCarousel = api);

            let x0 = 0, y0 = 0, t0 = 0, dx = 0, mode = null;
            el.addEventListener('touchstart', e => {
                if (e.touches.length !== 1) return;
                x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
                t0 = Date.now(); dx = 0; mode = null;
            }, { passive: true });
            el.addEventListener('touchmove', e => {
                if (e.touches.length !== 1) return;
                const mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
                if (!mode && (Math.abs(mx) > 8 || Math.abs(my) > 8)) mode = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
                if (mode !== 'x') return;
                e.preventDefault();
                dx = mx;
                track.classList.add('dragging');
                // rubber-band at the ends
                const edge = (i === 0 && dx > 0) || (i === n - 1 && dx < 0);
                const off = edge ? dx / 3 : dx;
                track.style.transform = `translateX(calc(${-i * 100}% + ${off}px))`;
            }, { passive: false });
            const end = () => {
                if (mode !== 'x') { mode = null; return; }
                track.classList.remove('dragging');
                const w = el.clientWidth, fast = Math.abs(dx) > 30 && Date.now() - t0 < 250;
                if ((dx < 0 && (fast || -dx > w * 0.15)) && i < n - 1) go(i + 1);
                else if ((dx > 0 && (fast || dx > w * 0.15)) && i > 0) go(i - 1);
                else go(i);
                mode = null;
            };
            el.addEventListener('touchend', end);
            el.addEventListener('touchcancel', end);
        }
        document.addEventListener('keydown', e => {
            if (!activeCarousel || /input|textarea/i.test(e.target.tagName)) return;
            if (e.key === 'ArrowLeft') activeCarousel.prev();
            else if (e.key === 'ArrowRight') activeCarousel.next();
        });

        function render() {
            const list = feed.items.filter(x => active === 'All' || x.g === active);
            const box = document.getElementById('postsContainer');
            if (!list.length) { box.innerHTML = '<div class="empty">Nothing in this topic today.</div>'; return; }
            box.innerHTML = list.map((x, k) => `
                <div class="card${k === 0 ? ' lead' : ''}">
                    <div class="card-image">
                        <div class="track">${(x.im || [x.i]).map((id, j) =>
                            `<img src="${esc(imgUrl(id))}" alt="" loading="${k < 3 && j === 0 ? 'eager' : 'lazy'}" referrerpolicy="no-referrer">`).join('')}</div>
                        <span class="tag">${esc(x.g)}</span>
                        ${(x.im || []).length > 1 ? `
                        <span class="count">1/${x.im.length}</span>
                        <button class="nav prev" aria-label="Previous image">&#10094;</button>
                        <button class="nav next" aria-label="Next image">&#10095;</button>
                        <div class="dots">${x.im.map((_, j) => `<span${j === 0 ? ' class="active"' : ''}></span>`).join('')}</div>` : ''}
                    </div>
                    <a class="card-body" href="https://www.wsj.com/${esc(x.p)}" target="_blank" rel="noopener">
                        <div class="section">${esc(x.s)}</div>
                        <h2>${esc(x.t)}</h2>
                        <ul>${(x.b || (x.d ? [x.d] : [])).map(li => `<li>${esc(li)}</li>`).join('')}</ul>
                    </a>
                </div>`).join('');
            box.querySelectorAll('.card-image').forEach(initCarousel);
        }

        function renderChips() {
            const present = new Set(feed.items.map(x => x.g));
            const chips = TOPICS.filter(t => t === 'All' || present.has(t));
            const el = document.getElementById('chips');
            el.innerHTML = chips.map(t => `<button class="chip${t === active ? ' active' : ''}" data-t="${t}">${t}</button>`).join('');
            el.querySelectorAll('.chip').forEach(b => b.onclick = () => {
                if (b.dataset.t === active) return;
                active = b.dataset.t;
                renderChips(); render(); window.scrollTo(0, 0);
            });
        }

        function stampOf(f) {
            if (f && f.updatedAt) { const t = Date.parse(f.updatedAt); if (!isNaN(t)) return t; }
            if (f && f.updated) return Date.parse(f.updated + 'T12:00:00');
            return 0;
        }

        function ago(ms) {
            const m = Math.round((Date.now() - ms) / 60000);
            if (m < 1) return 'just now';
            if (m < 60) return m + 'm ago';
            const h = Math.round(m / 60);
            if (h < 24) return h + 'h ago';
            return Math.round(h / 24) + 'd ago';
        }

        function renderHeader() {
            const el = document.getElementById('updated');
            if (!feed.updated && !feed.updatedAt) { el.textContent = ''; return; }
            let when;
            if (feed.updatedAt && !isNaN(Date.parse(feed.updatedAt))) {
                const d = new Date(feed.updatedAt);
                when = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }) +
                    ' · updated ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) +
                    ' (' + ago(d.getTime()) + ')';
            } else {
                when = new Date(feed.updated + 'T12:00:00')
                    .toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            }
            el.innerHTML = esc(when) + ' · ' + feed.items.length +
                ' stories · <a href="' + esc(feed.source) + '" target="_blank" rel="noopener">wsj.com/tech/ai</a>';
        }

        function renderAll() {
            const present = new Set(feed.items.map(x => x.g));
            if (active !== 'All' && !present.has(active)) active = 'All';
            renderHeader(); renderChips(); render();
        }

        // Always show the newest copy: the browser/CDN may hand back a cached
        // page, so re-fetch this page uncached and swap in its feed data if it
        // is newer than what was served.
        let checking = false;
        async function checkForNewer() {
            if (checking) return;
            checking = true;
            try {
                const url = location.pathname + '?fresh=' + Date.now();
                const res = await fetch(url, { cache: 'no-store' });
                if (!res.ok) return;
                const html = await res.text();
                const block = new DOMParser().parseFromString(html, 'text/html')
                    .getElementById('feed-data');
                if (!block) return;
                const sandbox = {};
                new Function('window', block.textContent)(sandbox);
                const fresh = sandbox.WSJ_FEED;
                if (!fresh || !Array.isArray(fresh.items) || !fresh.items.length) return;
                if (stampOf(fresh) > stampOf(feed)) {
                    feed = fresh;
                    renderAll();
                }
            } catch (e) {
                // offline or blocked: keep what we have
            } finally {
                checking = false;
            }
        }

        renderAll();
        checkForNewer();
        // back/forward cache restores and returning to a long-idle tab
        window.addEventListener('pageshow', e => { if (e.persisted) checkForNewer(); });
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') { renderHeader(); checkForNewer(); }
        });
    </script>
</body>
</html>
