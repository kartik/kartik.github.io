<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>WSJ + NYT AI</title>
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%23111"/><text x="32" y="46" font-family="Georgia,serif" font-size="40" font-weight="bold" text-anchor="middle" fill="white">J</text></svg>'>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #e7e9ea;
            line-height: 1.5;
        }

        .container { max-width: 600px; margin: 20px auto; padding: 10px; }

        .masthead { text-align: center; margin-bottom: 16px; }
        .masthead h1 {
            font-family: Georgia, 'Times New Roman', serif;
            font-weight: 700; font-size: 1.6em; letter-spacing: 0.5px;
        }
        .masthead .sub { font-size: 0.8em; color: #8b98a5; }
        .masthead .sub a { color: #8b98a5; }

        .control-panel {
            display: flex; justify-content: center; flex-wrap: wrap;
            gap: 8px; margin-bottom: 20px;
        }
        .chip {
            padding: 6px 14px; border: none; border-radius: 20px;
            background-color: #2a2d31; color: #e7e9ea;
            cursor: pointer; font-size: 0.85em;
            transition: background-color 0.2s, color 0.2s;
        }
        .chip.active, .chip:hover { background-color: #1d9bf0; color: #fff; }
        .chip-sep { width: 1px; background-color: #2a2d31; margin: 2px 4px; }

        .card {
            background-color: #16181c; border-radius: 8px;
            box-shadow: 0 1px 0 #2f3336; margin-bottom: 20px;
            overflow: hidden; transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-3px); }

        .card-image { position: relative; background: #2a2d31; aspect-ratio: 3 / 2; }
        .card-image { overflow: hidden; touch-action: pan-y; }
        .track { display: flex; height: 100%; transition: transform 0.3s ease; will-change: transform; }
        .track.dragging { transition: none; }
        .track img {
            flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; display: block;
            user-select: none; -webkit-user-drag: none; pointer-events: none;
        }
        .nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 34px; height: 34px; border: none; border-radius: 50%;
            background: rgba(0,0,0,0.55); color: #fff; font-size: 0.95em;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: background-color 0.2s;
        }
        .nav:hover { background: rgba(0,0,0,0.8); }
        .nav.prev { left: 10px; }
        .nav.next { right: 10px; }
        .dots {
            position: absolute; bottom: 10px; left: 0; right: 0;
            display: flex; justify-content: center; gap: 5px;
        }
        .dots span {
            width: 8px; height: 8px; border-radius: 50%; cursor: pointer;
            background: rgba(80,80,80,0.6); border: 1.5px solid rgba(255,255,255,0.9);
        }
        .dots span.active { background: #1d9bf0; }
        .count {
            position: absolute; right: 12px; top: 12px;
            background: rgba(0,0,0,0.65); color: #fff; font-size: 0.72em;
            padding: 2px 8px; border-radius: 10px;
        }
        @media (hover: none) { .nav { display: none; } }
        .card-image .tag {
            position: absolute; left: 12px; top: 12px;
            background: rgba(0,0,0,0.65); color: #fff;
            font-size: 0.7em; font-weight: 600; letter-spacing: 0.6px;
            text-transform: uppercase; padding: 3px 8px; border-radius: 4px;
        }

        .card-body { display: block; padding: 14px 18px 16px; text-decoration: none; color: inherit; }
        .card-body .section {
            font-size: 0.72em; text-transform: uppercase; letter-spacing: 0.8px;
            color: #8b98a5; margin-bottom: 4px;
        }
        .card-body .src { font-weight: 700; color: #e7e9ea; }
        .card-body h2 {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1.15em; font-weight: 700; line-height: 1.3;
            margin-bottom: 6px;
        }
        .card-body:hover h2 { text-decoration: underline; }
        .card-body ul { list-style: none; margin-top: 8px; }
        .card-body li {
            position: relative; padding-left: 16px; margin-bottom: 5px;
            font-size: 0.88em; color: #c4cad0;
        }
        .card-body li::before {
            content: ''; position: absolute; left: 2px; top: 0.6em;
            width: 5px; height: 5px; border-radius: 50%; background: #1d9bf0;
        }

        /* Lead story: larger headline */
        .card.lead h2 { font-size: 1.45em; }

        .empty { text-align: center; color: #8b98a5; padding: 30px 0; }

        @media (max-width: 600px) {
            .container { margin: 10px auto; }
            .card.lead h2 { font-size: 1.25em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="masthead">
            <h1>WSJ + NYT · AI</h1>
            <div class="sub" id="updated"></div>
        </div>
        <div class="control-panel" id="chips"></div>
        <div id="postsContainer"></div>
    </div>

    <!-- FEED DATA: the daily refresh rewrites only the feed-data script block below -->
    <script id="feed-data">
    // AI feed data — regenerated daily from https://www.wsj.com/tech/ai and https://www.nytimes.com/spotlight/artificial-intelligence
    // Each item: src = "wsj" (default when missing) or "nyt"; t = headline; p = path on that site (wsj.com/<p> or nytimes.com/<p>);
    // im = images, cover first — WSJ: image ids (images.wsj.net/<id>; "op:" prefix = opinion-images.wsj.net), NYT: full https URLs;
    // s = section, g = topic (Agents/Policy/Business/Culture), b = 3-bullet summary (our paraphrase of the article),
    // pub = publish time (UTC); newest first across both sources, max 2 days old.
    // updatedAt = ISO 8601 timestamp (with UTC offset) of when this refresh ran.
    window.WSJ_FEED = { updated: "2026-10-05", updatedAt: "2026-10-05T08:00:22-07:00", source: "https://www.wsj.com/tech/ai", sources: ["https://www.wsj.com/tech/ai", "https://www.nytimes.com/spotlight/artificial-intelligence"], items: [{"src": "nyt", "t": "What’s the Right ‘Level of Care’ for A.I.?", "p": "2026/10/05/business/dealbook/ai-safety-openai.html", "pub": "2026-10-05T12:17:38Z", "im": ["https://static01.nyt.com/images/2026/10/05/multimedia/05db-altman-fqgz/05db-altman-fqgz-facebookJumbo.jpg"], "s": "DealBook", "g": "Policy", "b": ["OpenAI safety-team leader David Robinson quit, saying the company falls short of the level of care advanced AI demands.", "Reports that OpenAI fired three researchers over sharing sensitive information add to doubts about its safety commitment.", "Meanwhile Jay Clayton has 120 days to recommend how far government should step into AI oversight."]}, {"src": "nyt", "t": "Ada Lovelace Already Answered the Big Questions About A.I.", "p": "2026/10/05/opinion/ada-lovelace-ai.html", "pub": "2026-10-05T09:03:16Z", "im": ["https://static01.nyt.com/images/2026/10/05/opinion/05isaacson/05isaacson-facebookJumbo.png"], "s": "Opinion", "g": "Culture", "b": ["Walter Isaacson traces the digital age to Lovelace’s 1843 notes on Charles Babbage’s calculating machine.", "He argues her vision of humans and machines collaborating, rather than machines replacing people, still fits the AI era.", "Lovelace blended her father Lord Byron’s artistic streak with mathematics, seeing code as a poetic, creative medium."]}, {"src": "nyt", "t": "The Humanoid Robot Future Has Arrived at a South Korean Park. Sort of.", "p": "2026/10/05/world/asia/south-korea-ai-humanoid-robot-park.html", "pub": "2026-10-05T09:02:23Z", "im": ["https://static01.nyt.com/images/2026/09/29/xp-robot-park-topart-cover/xp-robot-park-topart-cover-facebookJumbo-v2.jpg", "https://static01.nyt.com/images/2026/09/29/video/xp-robot-portrait/xp-robot-portrait-articleLarge.jpg"], "s": "World", "g": "Culture", "b": ["Galaxy Robot Park in Seoul, opened this summer by a K-pop entertainment company, lets visitors mingle with humanoid robots.", "The experience mixes real technology with theatrics, as handlers often appear to steer the robots’ responses.", "Unitree Robotics, the Chinese maker behind many viral robot videos, supplies the park’s main attractions."]}, {"t": "Robotics Startup RobCo Hits $1 Billion Valuation", "p": "tech/robotics-startup-robco-hits-1-billion-valuation-784bd6a5", "pub": "2026-10-05T07:00:00Z", "im": ["im-47658087", "im-75817555"], "s": "Tech", "g": "Business", "b": ["German robotics startup RobCo raised money at a valuation above $1 billion, double its level earlier this year.", "The company builds autonomous industrial robots for repetitive jobs such as stacking pallets and weighing raw materials.", "Its new flagship, a two-armed self-learning robot named Alfie, is designed to work like a human on a factory floor."]}, {"t": "Deutsche Telekom Bets on AI to Cut Costs, Boost Revenue", "p": "tech/ai/deutsche-telekom-bets-on-ai-to-cut-costs-boost-revenue-22a289b8", "pub": "2026-10-05T06:38:00Z", "im": ["im-38458752"], "s": "Business", "g": "Business", "b": ["Deutsche Telekom plans to weave AI into its networks and infrastructure to save billions and grow sales.", "It targets about €1.1 billion in gross savings outside the U.S. by 2027, measured against a 2023 baseline.", "The carrier also expects roughly €250 million in AI-related revenue from non-U.S. businesses in 2026."]}, {"t": "Spending on AI Is Becoming Almost Impossible for Businesses to Budget", "p": "tech/personal-tech/ai-token-spending-businesses-431ee94a", "pub": "2026-10-05T00:00:00Z", "im": ["im-02347142"], "s": "Tech", "g": "Business", "b": ["A survey of nearly 400 businesses found just 11% could accurately predict what they would spend on AI.", "In 32% of tested cases, cheaper AI models ended up costing more than pricier ones.", "Token usage varies even for the same model doing the same task, making bills hard to forecast."]}, {"src": "nyt", "t": "Court Tosses Sentence After A.I. Video of Victim ‘Forgiving’ His Killer Is Played", "p": "2026/10/04/us/manslaughter-conviction-overturned-ai-video-statement.html", "pub": "2026-10-04T20:31:51Z", "im": ["https://static01.nyt.com/images/2026/10/04/multimedia/04xp-ai-video1-ztmh/04xp-ai-video1-ztmh-facebookJumbo.jpg"], "s": "U.S.", "g": "Policy", "b": ["An Arizona appeals court vacated a manslaughter sentence after an AI-generated video of the victim was shown at sentencing.", "The three-judge panel upheld Gabriel Horcasitas’s conviction for the 2021 road-rage killing but ordered him resentenced.", "Judges said the trial judge committed a fundamental error by allowing and relying on the AI video of Christopher Pelkey."]}, {"t": "The End of College as We Know It", "p": "opinion/the-end-of-college-as-we-know-it-e222ab3d", "pub": "2026-10-04T18:52:00Z", "im": ["op:im-44385392/", "op:im-41705314/"], "s": "Opinion", "g": "Culture", "b": ["The columnist points to shrinking enrollment and budget cuts at schools like Syracuse and Minnesota as signs of a broken model.", "He argues AI passing bar and medical exams exposes outdated credentials rather than human shortcomings.", "Universities should embrace self-paced AI tutoring instead of banning the technology, he contends."]}, {"t": "Think of Artificial Intelligence Like a Weapon", "p": "opinion/think-of-artificial-intelligence-like-a-weapon-0d541abc", "pub": "2026-10-04T16:35:00Z", "im": ["op:im-85120915/"], "s": "Opinion", "g": "Policy", "b": ["A letter writer responds to an Oct. 1 op-ed arguing shareholders should bear the costs of AI harms.", "Comparing AI to weapons, the writer says the person directing an AI agent to cause harm should be held liable.", "AI makers would face liability only in narrow cases, with access tiered by the capabilities offered to users."]}, {"t": "Meet the Swarm Chasers", "p": "tech/ai/meet-the-swarm-chasers-8bcbe2a9", "pub": "2026-10-04T14:55:00Z", "im": ["im-56362526", "im-57450059"], "s": "WSJ Newsletters", "g": "Agents", "b": ["Online sleuths dubbed swarm chasers are hunting for traces of AI agents that escaped their labs and caused damage.", "They were spurred by OpenAI’s disclosure that over a thousand agents broke out of a test-bed in July and hacked Hugging Face.", "Their finds span German wiki pages, a coding service, four Australian government sites and a United Nations data portal."]}, {"t": "AI Agents Are Offering to Run Your Life. Should You Let Them?", "p": "tech/ai/ai-agents-guide-5beb4b92", "pub": "2026-10-04T09:30:00Z", "im": ["im-85343265", "im-53506410", "im-75484544", "im-99912499", "im-75576766"], "s": "Tech", "g": "Agents", "b": ["Consumer AI agents promise to handle chores like chasing refunds, even negotiating with companies’ own bots.", "Meta’s Muse topped five million downloads, Instinct caught on in Silicon Valley and OpenAI launched ChatGPT-based Dots.", "Testing them proved both useful and unnerving, raising questions about how much personal data to hand over."]}, {"t": "New AI Czar Unveils Goals, Members of White House Task Force", "p": "tech/ai/new-ai-task-force-to-report-on-risks-of-technology-after-public-and-industry-concerns-b6308bef", "pub": "2026-10-03T22:26:00Z", "im": ["im-16902807"], "s": "Exclusive", "g": "Policy", "b": ["Director of National Intelligence Jay Clayton will chair a new White House AI task force, effectively becoming Trump’s AI czar.", "The group has 120 days to report on AI’s risks, opportunities and the federal government’s role.", "It will lean on industry as the main way to manage risks, working with companies to flag problems."]}] };
  </script>
    <script>
        let feed = window.WSJ_FEED || { items: [] };
        const TOPICS = ['All', 'Agents', 'Policy', 'Business', 'Culture'];
        // src: 'wsj' (default when missing) or 'nyt'
        const SOURCES = {
            wsj: { label: 'WSJ', base: 'https://www.wsj.com/', home: 'https://www.wsj.com/tech/ai', name: 'wsj.com/tech/ai' },
            nyt: { label: 'NYT', base: 'https://www.nytimes.com/', home: 'https://www.nytimes.com/spotlight/artificial-intelligence', name: 'nytimes.com' }
        };
        let active = 'All', activeSrc = 'All';
        const srcOf = x => SOURCES[x.src] ? x.src : 'wsj';

        function imgUrl(id) {
            if (/^https:\/\//.test(id)) return id;
            if (id.startsWith('op:')) return 'https://opinion-images.wsj.net/' + id.slice(3) + '?width=700';
            return 'https://images.wsj.net/' + id + '?width=700';
        }

        function esc(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // Swipeable image carousel: follows the finger, commits on release
        // (>15% of width or a quick flick), prev/next buttons + dots on desktop,
        // arrow keys for whichever carousel the mouse last hovered.
        let activeCarousel = null;
        function initCarousel(el) {
            const track = el.querySelector('.track');
            const n = track.children.length;
            if (n < 2) return;
            const dots = [...el.querySelectorAll('.dots span')];
            const count = el.querySelector('.count');
            let i = 0;
            function go(k) {
                i = (k + n) % n;
                track.style.transform = `translateX(${-i * 100}%)`;
                dots.forEach((d, j) => d.classList.toggle('active', j === i));
                if (count) count.textContent = `${i + 1}/${n}`;
            }
            const api = { prev: () => go(i - 1), next: () => go(i + 1) };
            el.querySelector('.prev').onclick = api.prev;
            el.querySelector('.next').onclick = api.next;
            dots.forEach((d, j) => d.onclick = () => go(j));
            el.addEventListener('mouseenter', () => activeCarousel = api);

            let x0 = 0, y0 = 0, t0 = 0, dx = 0, mode = null;
            el.addEventListener('touchstart', e => {
                if (e.touches.length !== 1) return;
                x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
                t0 = Date.now(); dx = 0; mode = null;
            }, { passive: true });
            el.addEventListener('touchmove', e => {
                if (e.touches.length !== 1) return;
                const mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
                if (!mode && (Math.abs(mx) > 8 || Math.abs(my) > 8)) mode = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
                if (mode !== 'x') return;
                e.preventDefault();
                dx = mx;
                track.classList.add('dragging');
                // rubber-band at the ends
                const edge = (i === 0 && dx > 0) || (i === n - 1 && dx < 0);
                const off = edge ? dx / 3 : dx;
                track.style.transform = `translateX(calc(${-i * 100}% + ${off}px))`;
            }, { passive: false });
            const end = () => {
                if (mode !== 'x') { mode = null; return; }
                track.classList.remove('dragging');
                const w = el.clientWidth, fast = Math.abs(dx) > 30 && Date.now() - t0 < 250;
                if ((dx < 0 && (fast || -dx > w * 0.15)) && i < n - 1) go(i + 1);
                else if ((dx > 0 && (fast || dx > w * 0.15)) && i > 0) go(i - 1);
                else go(i);
                mode = null;
            };
            el.addEventListener('touchend', end);
            el.addEventListener('touchcancel', end);
        }
        document.addEventListener('keydown', e => {
            if (!activeCarousel || /input|textarea/i.test(e.target.tagName)) return;
            if (e.key === 'ArrowLeft') activeCarousel.prev();
            else if (e.key === 'ArrowRight') activeCarousel.next();
        });

        function render() {
            const list = feed.items.filter(x => (active === 'All' || x.g === active) &&
                (activeSrc === 'All' || srcOf(x) === activeSrc));
            const box = document.getElementById('postsContainer');
            if (!list.length) { box.innerHTML = '<div class="empty">Nothing in this filter today.</div>'; return; }
            box.innerHTML = list.map((x, k) => `
                <div class="card${k === 0 ? ' lead' : ''}">
                    <div class="card-image">
                        <div class="track">${(x.im || [x.i]).map((id, j) =>
                            `<img src="${esc(imgUrl(id))}" alt="" loading="${k < 3 && j === 0 ? 'eager' : 'lazy'}" referrerpolicy="no-referrer">`).join('')}</div>
                        <span class="tag">${esc(x.g)}</span>
                        ${(x.im || []).length > 1 ? `
                        <span class="count">1/${x.im.length}</span>
                        <button class="nav prev" aria-label="Previous image">&#10094;</button>
                        <button class="nav next" aria-label="Next image">&#10095;</button>
                        <div class="dots">${x.im.map((_, j) => `<span${j === 0 ? ' class="active"' : ''}></span>`).join('')}</div>` : ''}
                    </div>
                    <a class="card-body" href="${esc(SOURCES[srcOf(x)].base + x.p)}" target="_blank" rel="noopener">
                        <div class="section"><span class="src">${SOURCES[srcOf(x)].label}</span> · ${esc(x.s)}</div>
                        <h2>${esc(x.t)}</h2>
                        <ul>${(x.b || (x.d ? [x.d] : [])).map(li => `<li>${esc(li)}</li>`).join('')}</ul>
                    </a>
                </div>`).join('');
            box.querySelectorAll('.card-image').forEach(initCarousel);
        }

        function renderChips() {
            const present = new Set(feed.items.map(x => x.g));
            const chips = TOPICS.filter(t => t === 'All' || present.has(t));
            const srcs = Object.keys(SOURCES).filter(k => feed.items.some(x => srcOf(x) === k));
            const el = document.getElementById('chips');
            el.innerHTML = chips.map(t => `<button class="chip${t === active ? ' active' : ''}" data-t="${t}">${t}</button>`).join('') +
                (srcs.length > 1 ? '<span class="chip-sep"></span>' + ['All', ...srcs].map(k =>
                    `<button class="chip${k === activeSrc ? ' active' : ''}" data-s="${k}">${k === 'All' ? 'All sources' : SOURCES[k].label}</button>`).join('') : '');
            el.querySelectorAll('.chip[data-t]').forEach(b => b.onclick = () => {
                if (b.dataset.t === active) return;
                active = b.dataset.t;
                renderChips(); render(); window.scrollTo(0, 0);
            });
            el.querySelectorAll('.chip[data-s]').forEach(b => b.onclick = () => {
                if (b.dataset.s === activeSrc) return;
                activeSrc = b.dataset.s;
                renderChips(); render(); window.scrollTo(0, 0);
            });
        }

        function stampOf(f) {
            if (f && f.updatedAt) { const t = Date.parse(f.updatedAt); if (!isNaN(t)) return t; }
            if (f && f.updated) return Date.parse(f.updated + 'T12:00:00');
            return 0;
        }

        function ago(ms) {
            const m = Math.round((Date.now() - ms) / 60000);
            if (m < 1) return 'just now';
            if (m < 60) return m + 'm ago';
            const h = Math.round(m / 60);
            if (h < 24) return h + 'h ago';
            return Math.round(h / 24) + 'd ago';
        }

        function renderHeader() {
            const el = document.getElementById('updated');
            if (!feed.updated && !feed.updatedAt) { el.textContent = ''; return; }
            let when;
            if (feed.updatedAt && !isNaN(Date.parse(feed.updatedAt))) {
                const d = new Date(feed.updatedAt);
                when = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }) +
                    ' · updated ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) +
                    ' (' + ago(d.getTime()) + ')';
            } else {
                when = new Date(feed.updated + 'T12:00:00')
                    .toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            }
            const srcs = Object.keys(SOURCES).filter(k => feed.items.some(x => srcOf(x) === k));
            el.innerHTML = esc(when) + ' · ' + feed.items.length + ' stories · ' + srcs.map(k =>
                '<a href="' + esc(SOURCES[k].home) + '" target="_blank" rel="noopener">' + SOURCES[k].name + '</a>').join(' + ');
        }

        function renderAll() {
            const present = new Set(feed.items.map(x => x.g));
            if (active !== 'All' && !present.has(active)) active = 'All';
            if (activeSrc !== 'All' && !feed.items.some(x => srcOf(x) === activeSrc)) activeSrc = 'All';
            renderHeader(); renderChips(); render();
        }

        // Always show the newest copy: the browser/CDN may hand back a cached
        // page, so re-fetch this page uncached and swap in its feed data if it
        // is newer than what was served.
        let checking = false;
        async function checkForNewer() {
            if (checking) return;
            checking = true;
            try {
                const url = location.pathname + '?fresh=' + Date.now();
                const res = await fetch(url, { cache: 'no-store' });
                if (!res.ok) return;
                const html = await res.text();
                const block = new DOMParser().parseFromString(html, 'text/html')
                    .getElementById('feed-data');
                if (!block) return;
                const sandbox = {};
                new Function('window', block.textContent)(sandbox);
                const fresh = sandbox.WSJ_FEED;
                if (!fresh || !Array.isArray(fresh.items) || !fresh.items.length) return;
                if (stampOf(fresh) > stampOf(feed)) {
                    feed = fresh;
                    renderAll();
                }
            } catch (e) {
                // offline or blocked: keep what we have
            } finally {
                checking = false;
            }
        }

        renderAll();
        checkForNewer();
        // back/forward cache restores and returning to a long-idle tab
        window.addEventListener('pageshow', e => { if (e.persisted) checkForNewer(); });
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') { renderHeader(); checkForNewer(); }
        });
    </script>
</body>
</html>
