                const edge = (i === 0 && dx > 0) || (i === n - 1 && dx < 0);
                const off = edge ? dx / 3 : dx;
                track.style.transform = `translateX(calc(${-i * 100}% + ${off}px))`;
            }, { passive: false });
            const end = () => {
                if (mode !== 'x') { mode = null; return; }
                track.classList.remove('dragging');
                const w = el.clientWidth, fast = Math.abs(dx) > 30 && Date.now() - t0 < 250;
                if ((dx < 0 && (fast || -dx > w * 0.15)) && i < n - 1) go(i + 1);
                else if ((dx > 0 && (fast || dx > w * 0.15)) && i > 0) go(i - 1);
                else go(i);
                mode = null;
            };
            el.addEventListener('touchend', end);
            el.addEventListener('touchcancel', end);
        }
        document.addEventListener('keydown', e => {
            if (!activeCarousel || /input|textarea/i.test(e.target.tagName)) return;
            if (e.key === 'ArrowLeft') activeCarousel.prev();
            else if (e.key === 'ArrowRight') activeCarousel.next();
        });

        function render() {
            const list = feed.items.filter(x => (active === 'All' || x.g === active) &&
                (activeSrc === 'All' || srcOf(x) === activeSrc));
            const box = document.getElementById('postsContainer');
            if (!list.length) { box.innerHTML = '<div class="empty">Nothing in this filter today.</div>'; return; }
            box.innerHTML = list.map((x, k) => `
                <div class="card${k === 0 ? ' lead' : ''}">
                    <div class="card-image">
                        <div class="track">${(x.im || [x.i]).map((id, j) =>
                            `<img src="${esc(imgUrl(id))}" alt="" loading="${k < 3 && j === 0 ? 'eager' : 'lazy'}" referrerpolicy="no-referrer">`).join('')}</div>
                        <span class="tag">${esc(x.g)}</span>
                        ${(x.im || []).length > 1 ? `
                        <span class="count">1/${x.im.length}</span>
                        <button class="nav prev" aria-label="Previous image">&#10094;</button>
                        <button class="nav next" aria-label="Next image">&#10095;</button>
                        <div class="dots">${x.im.map((_, j) => `<span${j === 0 ? ' class="active"' : ''}></span>`).join('')}</div>` : ''}
                    </div>
                    <a class="card-body" href="${esc(SOURCES[srcOf(x)].base + x.p)}" target="_blank" rel="noopener">
                        <div class="section"><span class="src">${SOURCES[srcOf(x)].label}</span> · ${esc(x.s)}</div>
                        <h2>${esc(x.t)}</h2>
                        <ul>${(x.b || (x.d ? [x.d] : [])).map(li => `<li>${esc(li)}</li>`).join('')}</ul>
                    </a>
                </div>`).join('');
            box.querySelectorAll('.card-image').forEach(initCarousel);
        }

        function renderChips() {
            const present = new Set(feed.items.map(x => x.g));
            const chips = TOPICS.filter(t => t === 'All' || present.has(t));
            const srcs = Object.keys(SOURCES).filter(k => feed.items.some(x => srcOf(x) === k));
            const el = document.getElementById('chips');
            el.innerHTML = chips.map(t => `<button class="chip${t === active ? ' active' : ''}" data-t="${t}">${t}</button>`).join('') +
                (srcs.length > 1 ? '<span class="chip-sep"></span>' + ['All', ...srcs].map(k =>
                    `<button class="chip${k === activeSrc ? ' active' : ''}" data-s="${k}">${k === 'All' ? 'All sources' : SOURCES[k].label}</button>`).join('') : '');
            el.querySelectorAll('.chip[data-t]').forEach(b => b.onclick = () => {
                if (b.dataset.t === active) return;
                active = b.dataset.t;
                renderChips(); render(); window.scrollTo(0, 0);
            });
            el.querySelectorAll('.chip[data-s]').forEach(b => b.onclick = () => {
                if (b.dataset.s === activeSrc) return;
                activeSrc = b.dataset.s;
                renderChips(); render(); window.scrollTo(0, 0);
            });
        }

        function stampOf(f) {
            if (f && f.updatedAt) { const t = Date.parse(f.updatedAt); if (!isNaN(t)) return t; }
            if (f && f.updated) return Date.parse(f.updated + 'T12:00:00');
            return 0;
        }

        function ago(ms) {
            const m = Math.round((Date.now() - ms) / 60000);
            if (m < 1) return 'just now';
            if (m < 60) return m + 'm ago';
            const h = Math.round(m / 60);
            if (h < 24) return h + 'h ago';
            return Math.round(h / 24) + 'd ago';
        }

        function renderHeader() {
            const el = document.getElementById('updated');
            if (!feed.updated && !feed.updatedAt) { el.textContent = ''; return; }
            let when;
            if (feed.updatedAt && !isNaN(Date.parse(feed.updatedAt))) {
                const d = new Date(feed.updatedAt);
                when = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }) +
                    ' · updated ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) +
                    ' (' + ago(d.getTime()) + ')';
            } else {
                when = new Date(feed.updated + 'T12:00:00')
                    .toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            }
            const srcs = Object.keys(SOURCES).filter(k => feed.items.some(x => srcOf(x) === k));
            el.innerHTML = esc(when) + ' · ' + feed.items.length + ' stories · ' + srcs.map(k =>
                '<a href="' + esc(SOURCES[k].home) + '" target="_blank" rel="noopener">' + SOURCES[k].name + '</a>').join(' + ');
        }

        function renderAll() {
            const present = new Set(feed.items.map(x => x.g));
            if (active !== 'All' && !present.has(active)) active = 'All';
            if (activeSrc !== 'All' && !feed.items.some(x => srcOf(x) === activeSrc)) activeSrc = 'All';
            renderHeader(); renderChips(); render();
        }

        // Always show the newest copy: the browser/CDN may hand back a cached
        // page, so re-fetch this page uncached and swap in its feed data if it
        // is newer than what was served.
        let checking = false;
        async function checkForNewer() {
            if (checking) return;
            checking = true;
            try {
                const url = location.pathname + '?fresh=' + Date.now();
                const res = await fetch(url, { cache: 'no-store' });
                if (!res.ok) return;
                const html = await res.text();
                const block = new DOMParser().parseFromString(html, 'text/html')
                    .getElementById('feed-data');
                if (!block) return;
                const sandbox = {};
                new Function('window', block.textContent)(sandbox);
                const fresh = sandbox.WSJ_FEED;
                if (!fresh || !Array.isArray(fresh.items) || !fresh.items.length) return;
                if (stampOf(fresh) > stampOf(feed)) {
                    feed = fresh;
                    renderAll();
                }
            } catch (e) {
                // offline or blocked: keep what we have
            } finally {
                checking = false;
            }
        }

        renderAll();
        checkForNewer();
        // back/forward cache restores and returning to a long-idle tab
        window.addEventListener('pageshow', e => { if (e.persisted) checkForNewer(); });
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') { renderHeader(); checkForNewer(); }
        });
    </script>
</body>
</html>
